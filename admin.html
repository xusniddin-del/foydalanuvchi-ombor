<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — Vector</title>
<link rel="icon" href="assets/img/vector-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* ===== Admin: qorong'i shisha uslubi ===== */
  :root[data-theme="dark"] {
    --bg: #070B18; --card: rgba(255,255,255,.045); --soft: rgba(255,255,255,.06); --line: rgba(255,255,255,.09);
    --ink: #EEF2FA; --ink-2: #C5CEE0; --muted: #8E9AB5; --blue: #5B9BFF; --blue-600: #4C8DFF; --blue-50: rgba(91,155,255,.14); --blue-100: rgba(91,155,255,.24);
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.25);
  }
  body { min-height: 100vh; background:
      radial-gradient(900px 520px at 12% -8%, rgba(46,104,240,.30), transparent 60%),
      radial-gradient(700px 480px at 100% 0%, rgba(255,138,0,.20), transparent 60%),
      radial-gradient(800px 600px at 60% 110%, rgba(122,90,248,.18), transparent 60%), #070B18;
    background-attachment: fixed; }
  .card, .table-wrap { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  table.t th { background: rgba(255,255,255,.035); }
  table.t tr:hover td { background: rgba(255,255,255,.03); }
  .input, .select, .textarea { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.12); }
  .select option { background: #111729; }
  .modal { background: #10172B; border: 1px solid rgba(255,255,255,.1); }
  .modal-bg { background: rgba(3,6,15,.6); }
  .skeleton { background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.04) 75%); background-size: 200% 100%; }

  .app { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: rgba(4,7,16,.72); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,.07); color: #AEB9D0; padding: 22px 14px; display: flex; flex-direction: column; gap: 3px; scrollbar-width: thin; }
  .side .logo { color: #fff; padding: 2px 10px 22px; }
  .side .grp { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5F6B86; padding: 14px 12px 6px; }
  .side a.nv { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: #AEB9D0; font-weight: 500; font-size: 14.5px; transition: background .15s, color .15s; }
  .side a.nv .ic { opacity: .85; }
  .side a.nv:hover { background: rgba(255,255,255,.06); color: #fff; }
  .side a.nv[aria-current="page"] { background: linear-gradient(135deg, #4C8DFF, #79B0FF); color: #fff; font-weight: 600; box-shadow: 0 8px 24px rgba(76,141,255,.35); }
  .side .cnt { margin-left: auto; background: var(--orange); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 8px; font-weight: 700; }
  .content { padding: clamp(16px, 3vw, 32px); min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
  .topbar h1 { font-size: clamp(24px, 2.6vw, 30px); font-weight: 800; margin-right: auto; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: var(--ink-2); }
  .chip.warm { background: linear-gradient(135deg, #FFE2B8, #FFC98A); color: #4A2A00; border-color: transparent; }
  a.chip:hover { color: #fff; background: rgba(255,255,255,.1); }
  .me { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #1E63F0, #0B2A7A); border: 2px solid rgba(255,255,255,.18); }
  .me img { width: 24px; height: 24px; }
  .mbar { display: none; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 60; transform: translateX(-100%); transition: transform .25s; background: #070B18; }
    .side.open { transform: none; box-shadow: var(--shadow-lg); }
    .mbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(7,11,24,.85); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: #fff; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(255,255,255,.07); }
    .mbar .icon-btn { background: rgba(255,255,255,.1); color: #fff; }
  }

  /* bosh panel */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 18px; }
  .kpi { position: relative; overflow: hidden; border-radius: 22px; padding: 18px 20px; color: #fff; display: flex; flex-direction: column; gap: 4px; min-height: 132px; box-shadow: 0 16px 40px rgba(0,0,0,.28); }
  .kpi::after { content: ''; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.12); }
  .kpi .h { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; opacity: .95; }
  .kpi .h i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.2); }
  .kpi .h i .ic { width: 18px; height: 18px; }
  .kpi b { font-size: clamp(24px, 2.4vw, 30px); font-weight: 800; letter-spacing: -.02em; margin-top: 8px; }
  .kpi small { font-size: 13px; opacity: .88; }
  .kpi a { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  .k1 { background: linear-gradient(135deg, #2A5BD7, #4C8DFF); }
  .k2 { background: linear-gradient(135deg, #5B3FD0, #8B6BFF); }
  .k3 { background: linear-gradient(135deg, #B0336B, #E5578C); }
  .k4 { background: linear-gradient(135deg, #C25B0E, #F08A2B); }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .kpis { grid-template-columns: 1fr; } }
  .dash { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .dash .wide { grid-column: 1 / -1; }
  @media (max-width: 1000px) { .dash { grid-template-columns: 1fr; } }
  .panel { border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .panel .ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .panel h2 { font-size: 16px; font-weight: 700; }
  .panel .big { font-size: clamp(22px, 2.2vw, 26px); white-space: nowrap; font-weight: 800; letter-spacing: -.02em; }
  .pill { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.07); color: var(--ink-2); white-space: nowrap; }
  /* ustunli grafik */
  .bars { position: relative; display: grid; grid-template-columns: 44px 1fr; grid-template-rows: 210px auto; gap: 8px; margin-top: 14px; }
  .bars .ya { position: relative; font-size: 11.5px; color: var(--muted); }
  .bars .ya span { position: absolute; right: 0; transform: translateY(50%); }
  .bars .plot { position: relative; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid rgba(255,255,255,.14); }
  .bars .gl { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.06); pointer-events: none; }
  .bars .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; cursor: default; }
  .bars .col i { display: block; width: min(24px, 70%); border-radius: 4px 4px 0 0; background: var(--c); min-height: 2px; transition: filter .15s; }
  .bars .col:hover i { filter: brightness(1.25); }
  .bars .col .v { font-size: 11.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; white-space: nowrap; }
  .bars .xa { grid-column: 2; display: flex; gap: 2px; font-size: 11.5px; color: var(--muted); }
  .bars .xa span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }
  .tip { position: fixed; z-index: 90; pointer-events: none; background: #1A2340; border: 1px solid rgba(255,255,255,.12); color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.4); transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; }
  .tip small { display: block; color: #A9B4CC; font-size: 12px; }
  /* gorizontal ro'yxat */
  .hrow { display: grid; grid-template-columns: minmax(70px, auto) 1fr auto; align-items: center; gap: 10px; font-size: 14px; padding: 6px 0; }
  .hrow .tr { height: 10px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
  .hrow .tr i { display: block; height: 100%; border-radius: 999px; background: #4C8DFF; }
  .mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
  .mini > div { border-radius: 16px; padding: 12px 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 2px; }
  .mini span { font-size: 13px; color: var(--muted); }
  .mini b { font-size: 20px; font-weight: 800; }
  .page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-h h1 { font-size: clamp(22px, 2.6vw, 28px); font-weight: 800; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat { padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .stat span { color: var(--muted); font-size: 14px; }
  .stat b { font-size: 26px; font-weight: 800; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .tools .input, .tools .select { min-height: 42px; width: auto; flex: 1 1 200px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login .logo { color: #fff; }
  .login form { width: min(400px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .qed { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--soft); }
  .qed .o { display: flex; gap: 8px; align-items: center; }
  .qed .o input[type=radio] { width: 18px; height: 18px; accent-color: var(--green); flex: none; }
  .thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--soft); }
  .course-box { margin-bottom: 18px; }
  .course-box summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .course-box summary::-webkit-details-marker { display: none; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function () {
  'use strict';
  const { esc, money, num, icon, date, dateTime, safeUrl, avatarHtml, toast, modal, busy, confirmBox } = VX;
  // Tezlik: o'qish so'rovlari eslab qolinadi — sahifa qayta ochilganda darhol chiqadi, yangisi orqada yuklanadi.
  // Har qanday o'zgartirish (saqlash, tasdiqlash...) keshni tozalaydi.
  const READ = new Set(['a.stats', 'a.users', 'a.payments', 'a.orders', 'a.courses', 'a.products', 'a.plans', 'a.settings', 'a.coinlog', 'a.apps', 'a.donations', 'a.refs']);
  const RC = new Map();
  let ROUTE = 0, SILENT = -1;
  const raw = (a, d) => VX.call(a, d, { admin: true });
  function call(a, d) {
    if (!READ.has(a)) { RC.clear(); return raw(a, d); }
    const k = a + JSON.stringify(d || {}), at = ROUTE, old = RC.get(k);
    const fresh = raw(a, d).then(r => {
      const changed = old && JSON.stringify(old) !== JSON.stringify(r);
      RC.set(k, r);
      if (changed && at === ROUTE && SILENT !== ROUTE) { SILENT = ROUTE; setTimeout(() => go(true), 0); } // bir sahifaga bir marta
      return r;
    });
    if (old) { fresh.catch(() => {}); return Promise.resolve(old); }
    return fresh;
  }
  document.documentElement.setAttribute('data-theme', 'dark'); // admin panel doim qorong'i uslubda
  const root = document.getElementById('root');
  let content;

  // ================= KIRISH =================
  function loginScreen(msg) {
    root.innerHTML = `<div class="login"><form class="card pad" id="lf">
      <a class="logo" href="index.html"><img src="assets/img/vector-logo.png" alt=""><span>VECTOR</span></a>
      <h1 style="font-size:24px;margin-top:8px">Admin panel</h1>
      <label class="field"><span>Admin paroli</span><input class="input" type="password" name="p" autocomplete="current-password" required></label>
      <div class="err" ${msg ? '' : 'hidden'}>${esc(msg || '')}</div>
      <button class="btn btn-primary btn-lg" type="submit">Kirish</button>
      <p class="hint">Parol Google Sheets'dagi "Vector → Admin parolini o'rnatish" menyusida o'rnatiladi.</p></form></div>`;
    document.getElementById('lf').onsubmit = e => {
      e.preventDefault(); const f = e.currentTarget;
      busy(f.querySelector('[type=submit]'), async () => { const r = await VX.call('admin.login', { password: f.p.value }); VX.setAdminToken(r.token); shell(); })
        .catch(err => { const er = f.querySelector('.err'); er.textContent = err.message; er.hidden = false; });
    };
  }

  // ================= QOBIQ =================
  const NAV = [['panel', 'Bosh panel', 'chart'], ['oquvchilar', "O'quvchilar", 'users'], ['tolovlar', "To'lovlar", 'card'], ['kurslar', 'Kurslar va darslar', 'book'],
    ['dokon', "Do'kon", 'shop'], ['buyurtmalar', 'Buyurtmalar', 'box'], ['coinlar', 'Coinlar tarixi', 'coin'], ['arizalar', 'Sardor arizalari', 'users'], ['donatlar', 'Donatlar', 'coin'], ['takliflar', 'Takliflar (promokod)', 'star'], ['xabar', 'Telegram xabar', 'tg'], ['tariflar', 'Tariflar', 'star'], ['sozlamalar', 'Sozlamalar', 'settings']];
  const GRP = { 0: 'Asosiy', 3: "Ta'lim va do'kon", 7: 'Jamoa', 10: 'Sozlash' };
  function shell() {
    root.innerHTML = `<div class="mbar"><button class="icon-btn" id="mb" aria-label="Menyu">${icon('menu')}</button><b>Vector Admin</b></div>
      <div class="app"><aside class="side" id="side"><a class="logo" href="index.html" target="_blank"><img src="assets/img/vector-logo.png" alt=""><span>VECTOR</span></a>
      ${NAV.map(([id, t, ic], i) => `${GRP[i] ? `<div class="grp">${GRP[i]}</div>` : ''}<a class="nv" href="#${id}" data-nav="${id}">${icon(ic)}<span>${t}</span><span class="cnt" data-cnt="${id}" hidden></span></a>`).join('')}
      <div style="margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:3px"><a class="nv" href="kabinet.html" target="_blank">${icon('user')} O'quvchi kabineti</a><a class="nv" href="#" id="out">${icon('logout')} Chiqish</a></div></aside>
      <main class="content" id="content"></main></div>`;
    content = document.getElementById('content');
    document.getElementById('mb').onclick = () => document.getElementById('side').classList.toggle('open');
    document.getElementById('out').onclick = async e => { e.preventDefault(); try { await call('logout', { token: VX.adminToken() }); } catch (_) {} VX.setAdminToken(null); loginScreen(); };
    window.onhashchange = go; go();
  }
  const pages = { panel: pPanel, oquvchilar: pUsers, tolovlar: pPayments, kurslar: pCourses, dokon: pProducts, buyurtmalar: pOrders, coinlar: pCoinLog, arizalar: pApps, donatlar: pDonations, takliflar: pRefs, xabar: pBroadcast, tariflar: pPlans, sozlamalar: pSettings };
  async function go(silent) {
    const name = (location.hash.slice(1) || 'panel').split('/')[0], fn = pages[name] || pPanel;
    if (silent === true) {
      // orqada yangi ma'lumot keldi: oyna ochiq bo'lsa yoki admin yozayotgan bo'lsa — tegmaymiz
      const ae = document.activeElement;
      if (document.querySelector('.modal-bg') || (ae && content.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) return;
      const y = scrollY; document.querySelectorAll('.tip').forEach(t => t.remove());
      try { await fn(); } catch (_) {}
      window.scrollTo(0, y); return;
    }
    ROUTE++;
    document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === (pages[name] ? name : 'panel') ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    document.getElementById('side').classList.remove('open');
    document.querySelectorAll('.tip').forEach(t => t.remove());
    content.innerHTML = '<div class="skeleton" style="height:120px;margin-bottom:14px"></div><div class="skeleton" style="height:320px"></div>';
    try { await fn(); } catch (e) {
      if (e.code === 'auth') return loginScreen(e.message);
      content.innerHTML = `<div class="card empty"><b>${esc(e.message)}</b><button class="btn btn-primary" onclick="location.reload()">Qayta urinish</button></div>`;
    }
  }
  function counts(s) {
    const set = (k, v) => { const el = document.querySelector(`[data-cnt="${k}"]`); if (el) { el.textContent = v; el.hidden = !v; } };
    set('tolovlar', s.pendingPayments); set('buyurtmalar', s.newOrders);
  }
  const head = (t, sub, right) => `<div class="page-h"><div><h1>${t}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}</div>${right || ''}</div>`;
  const MONTHS = ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'Iyun', 'Iyul', 'Avg', 'Sen', 'Okt', 'Noy', 'Dek'];
  const short = n => n >= 1e6 ? (Math.round(n / 1e5) / 10 + ' mln').replace('.', ',') : n >= 1e3 ? Math.round(n / 1e3) + ' ming' : String(n);
  const nice = x => { if (!(x > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(v => v >= x); };
  /** Bitta qatorli ustunli grafik: data = [{label, value, tip}] */
  function barChart(data, color, fmtAxis, integer) {
    const max = Math.max(0, ...data.map(d => d.value)), step = Math.max(nice(max / 4), integer ? 1 : 0), top = step * 4;
    const ticks = [0, 1, 2, 3, 4].map(i => i * step);
    const peak = data.reduce((a, d, i) => d.value > data[a].value ? i : a, 0);
    return `<div class="bars" style="--c:${color}">
      <div class="ya">${ticks.map(v => `<span style="bottom:${v / top * 100}%">${fmtAxis(v)}</span>`).join('')}</div>
      <div class="plot">${ticks.slice(1).map(v => `<div class="gl" style="bottom:${v / top * 100}%"></div>`).join('')}
        ${data.map((d, i) => `<div class="col" data-tip="${esc(d.tip)}">${i === peak && d.value > 0 ? `<span class="v">${fmtAxis(d.value)}</span>` : ''}<i style="height:${top ? d.value / top * 100 : 0}%"></i></div>`).join('')}</div>
      <div class="xa">${data.map(d => `<span>${esc(d.label)}</span>`).join('')}</div></div>`;
  }
  function bindTips(el) {
    let tip = null;
    el.querySelectorAll('[data-tip]').forEach(c => {
      c.onmouseenter = () => { tip = document.createElement('div'); tip.className = 'tip'; tip.innerHTML = c.dataset.tip; document.body.appendChild(tip); const r = c.querySelector('i').getBoundingClientRect(); tip.style.left = (r.left + r.width / 2) + 'px'; tip.style.top = r.top + 'px'; };
      c.onmouseleave = () => { if (tip) tip.remove(); tip = null; };
    });
  }
  const form2obj = f => Object.fromEntries(new FormData(f).entries());

  // ================= BOSH PANEL =================
  async function pPanel() {
    const s = await call('a.stats'); counts(s);
    const S = s.series || null, now = new Date();
    const prev = S ? S.months[4].revenue : 0, cur = S ? S.months[5].revenue : s.revenueMonth;
    const diff = prev ? Math.round((cur - prev) / prev * 100) : null;
    const half = S ? S.months.reduce((n, m) => n + m.revenue, 0) : 0;
    const newUsers = S ? S.days.reduce((n, d) => n + d.users, 0) : 0;
    const plansTot = S ? S.plans.reduce((n, p) => n + p.revenue, 0) : 0;
    content.innerHTML = `<div class="topbar"><h1>Bosh panel</h1>
        <span class="chip warm">${icon('cake')} ${now.getDate()} ${MONTHS[now.getMonth()].toLowerCase()}, ${now.getFullYear()}</span>
        <a class="chip" href="index.html" target="_blank" rel="noopener">${icon('home')} Saytni ochish</a>
        ${s.tgBot ? `<a class="chip" href="https://t.me/${esc(s.tgBot)}" target="_blank" rel="noopener">${icon('tg')} @${esc(s.tgBot)}</a>` : ''}
        <span class="me" title="Admin"><img src="assets/img/vector-logo-white.png" alt=""></span></div>
      <div class="kpis">
        <div class="kpi k1"><div class="h"><i>${icon('users')}</i>Jami o'quvchilar</div><b>${num(s.users)}</b><small>Bugun: +${s.todayUsers}</small></div>
        <div class="kpi k2"><div class="h"><i>${icon('crown')}</i>Faol obunachilar</div><b>${num(s.active)}</b><small>${s.users ? Math.round(s.active / s.users * 100) : 0}% o'quvchilardan</small></div>

    const drawQ = () => {
      qs.innerHTML = quiz.map((q, i) => `<div class="qed" data-i="${i}"><div class="row"><b>${i + 1}.</b><input class="input" data-q value="${esc(q.q)}" placeholder="Savol matni"><button type="button" class="icon-btn" data-rq aria-label="Savolni o'chirish">${icon('trash')}</button></div>
        ${q.o.map((o, j) => `<div class="o"><input type="radio" name="a${i}" value="${j}" ${q.a === j ? 'checked' : ''} aria-label="To'g'ri javob"><input class="input" data-o="${j}" value="${esc(o)}" placeholder="Javob ${j + 1}"><button type="button" class="icon-btn" data-ro="${j}" aria-label="Javobni o'chirish" ${q.o.length <= 2 ? 'disabled' : ''}>${icon('x')}</button></div>`).join('')}
        ${q.o.length < 6 ? '<button type="button" class="btn btn-plain btn-sm" data-ao style="align-self:flex-start">+ Javob</button>' : ''}</div>`).join('');
      qs.querySelectorAll('.qed').forEach(box => {
        const i = Number(box.dataset.i), q = quiz[i];
        box.querySelector('[data-q]').oninput = e => { q.q = e.target.value; };
        box.querySelectorAll('[data-o]').forEach(inp => inp.oninput = () => { q.o[Number(inp.dataset.o)] = inp.value; });
        box.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => { q.a = Number(r.value); });
        box.querySelector('[data-rq]').onclick = () => { quiz.splice(i, 1); drawQ(); };
        box.querySelectorAll('[data-ro]').forEach(b => b.onclick = () => { const j = Number(b.dataset.ro); q.o.splice(j, 1); if (q.a >= q.o.length) q.a = 0; else if (q.a > j) q.a--; drawQ(); });
        const ao = box.querySelector('[data-ao]'); if (ao) ao.onclick = () => { q.o.push(''); drawQ(); };
      });
    };
    drawQ();
    m.el.querySelector('#addQ').onclick = () => { quiz.push({ q: '', o: ['', '', ''], a: 0 }); drawQ(); qs.lastElementChild.querySelector('[data-q]').focus(); };
    m.el.querySelector('#lf2').onsubmit = e => {
      e.preventDefault(); const d = form2obj(e.currentTarget);
      const lesson = { id: l.id, courseId: l.courseId, title: d.title, youtube: d.youtube, duration: d.duration, desc: d.desc, order: d.order, active: !!e.currentTarget.active.checked, quiz };
      busy(m.el.querySelector('#sv'), () => call('a.lesson.save', { lesson })).then(() => { toast('Dars saqlandi', 'success'); m.close(); pCourses(); }).catch(err => toast(err.message, 'error'));
    };
    const del = m.el.querySelector('#del');
    if (del) del.onclick = async () => { if (await confirmBox(`"${l.title}" darsi o'chirilsinmi?`, "O'chirish", true)) call('a.lesson.delete', { id: l.id }).then(() => { m.close(); pCourses(); }).catch(err => toast(err.message, 'error')); };
  }

  // ================= SOZLAMALAR =================
  async function pSettings() {
    const r = await call('a.settings');
    const groups = [['Sayt', ['site_name', 'hero_title', 'hero_text', 'stat_videos', 'stat_schools', 'stat_clients']], ['Aloqa va tarmoqlar', ['phone', 'telegram', 'instagram', 'youtube', 'facebook', 'address', 'app_store', 'google_play']], ['Coinlar', ['coin_per_correct', 'birthday_coins', 'daily_goal']], ['Karta orqali to\'lov (test rejimi)', ['card_number', 'card_holder']], ['Do\'stlarni taklif qilish va jamoa', ['ref_discount', 'ref_coins', 'ref_bonuses', 'team_limit']], ['Boshqa', ['site_url', 'mini_app', 'app_url']],
      ["To'lov (TezCheck / Click / Payme)", ['payment_mode', 'click_service_id', 'click_merchant_id', 'payme_merchant_id', 'return_url']]];
    const by = Object.fromEntries(r.settings.map(s => [s.key, s]));
    content.innerHTML = head('Sozlamalar') + `<form class="stack" id="sf" style="gap:18px;max-width:820px">${groups.map(([g, keys]) => `<div class="card pad stack"><h2 style="font-size:18px">${g}</h2>
      ${keys.map(k => { const s = by[k] || { value: '', note: '' };
        if (k === 'payment_mode') return `<label class="field"><span>To'lov rejimi</span><select class="select" name="${k}"><option value="test" ${s.value !== 'live' ? 'selected' : ''}>Test — to'lovni admin tasdiqlaydi</option><option value="tezcheck" ${s.value === 'tezcheck' ? 'selected' : ''}>TezCheck — Click, Payme, Uzum, karta (avtomatik)</option><option value="live" ${s.value === 'live' ? 'selected' : ''}>Live — Click/Payme to'g'ridan-to'g'ri</option></select>${r.tezcheck ? '<span class="hint" style="color:var(--green-600, #15803d)">✓ TezCheck ulangan</span>' : '<span class="hint">TezCheck ulanmagan: Google Sheets → Vector → «5. TezCheck to\'lovini ulash».</span>'}${r.worker ? '' : '<span class="hint" style="color:var(--orange-600)">⚠️ To\'lov serveri kaliti yaratilmagan (Google Sheets → Vector → 3-band). Faqat «Live» rejim uchun kerak.</span>'}</label>`;
        return `<label class="field"><span>${esc(s.note || k)}</span>${k === 'hero_text' ? `<textarea class="textarea" name="${k}">${esc(s.value)}</textarea>` : `<input class="input" name="${k}" value="${esc(s.value)}">`}</label>`; }).join('')}</div>`).join('')}
      <div><button class="btn btn-primary btn-lg">Saqlash</button></div></form>`;
    document.getElementById('sf').onsubmit = e => { e.preventDefault(); const d = form2obj(e.currentTarget);
      busy(e.currentTarget.querySelector('.btn-primary'), () => call('a.settings.save', { settings: d })).then(() => { VX.clearPublic(); toast('Sozlamalar saqlandi', 'success'); }).catch(err => toast(err.message, 'error')); };
  }

  VX.adminToken() ? shell() : loginScreen();
})();
</script>
</body>
</html>
