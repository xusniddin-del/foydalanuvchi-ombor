<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECTOR — Barcha kurslar</title>
<meta name="theme-color" content="#1E63F0">
<link rel="icon" href="assets/img/vector-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,310px),1fr)); gap: 26px; }
  .card { background: var(--white); border: var(--line); border-radius: 24px; box-shadow: var(--sh); overflow: hidden; display: flex; flex-direction: column; animation: vIn .4s ease-out both; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translate(-3px,-3px); box-shadow: 9px 9px 0 var(--ink); }
  .card .img { aspect-ratio: 3/2; border-bottom: var(--line); background: #0A1B4A; overflow: hidden; }
  .card .img img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .card h2 { margin: 0; font-size: 20px; line-height: 1.2; }
  .t { font-size: 15px; color: var(--ink-2); }
  .pr { font-size: 15px; color: var(--muted); margin-top: auto; }
  .pr strong { color: var(--ink); }
  .card .btn { width: 100%; margin-top: 6px; }
  .empty { padding: 60px 20px; text-align: center; font-weight: 700; color: var(--ink-2); margin: 0; border: 3px dashed var(--ink); border-radius: 24px; }
</style>
</head>
<body>
<div class="page">
<header id="vh"></header>
<main class="inner">
  <div class="inner-top">
    <div><h1>Barcha kurslar</h1><p>Har bir kurs noldan boshlanadi. Darsni ko'ring, testni yeching, coin to'plang.</p></div>
    <label class="search"><span class="ms">search</span><input id="q" placeholder="Kurs qidirish" aria-label="Kurs qidirish"></label>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Hech narsa topilmadi.</p>
</main>
<footer id="vf"></footer>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const { esc, loggedIn } = VSite;
  const fmt = n => Number(n || 0).toLocaleString('en-US').replace(/,/g, ' ') + " so'm";
  const safe = u => /^(https:\/\/|assets\/)/.test(String(u || '')) ? u : '';
  const SAMPLE = [['Kompyuter savodxonligi', 350000], ['AI kontent', 450000], ['Grafik dizayn', 450000], ['No Coding', 400000], ['Scratch', 350000], ['UI/UX dizayn', 400000], ['Kiber xavfsizlik', 600000]]
    .map(([title, price], i) => ({ title, price, image: 'assets/img/courses/kurs-' + (i + 1) + '.png', teacher: 'Xusniddin Sharofiddinov' }));
  let ALL = SAMPLE;
  function draw() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const list = q ? ALL.filter(c => c.title.toLowerCase().includes(q)) : ALL;
    document.getElementById('grid').innerHTML = list.map((c, i) => `<article class="card" style="animation-delay:${i * 40}ms">
      <div class="img">${safe(c.image) ? `<img src="${esc(c.image)}" alt="${esc(c.title)} kursi muqovasi" loading="lazy">` : ''}</div>
       <div class="body"><div class="meta">${c.lessons ? `<span class="chip blue">${Number(c.lessons)} ta dars</span>` : ''}<span class="chip lime">Test + coin</span></div>
      <h2>${esc(c.title)}</h2>
      <div class="t">Ustoz: ${esc(c.teacher || 'Xusniddin Sharofiddinov')}</div>
      ${c.price ? `<div class="pr">Oflayn kurs narxi: <strong>${fmt(c.price)}</strong></div>` : ''}
      <a class="btn btn-orange" href="${loggedIn ? 'kabinet.html#kurslar' : 'kirish.html?mode=register'}">Kursga yozilish</a></div></article>`).join('');
    document.getElementById('empty').hidden = list.length > 0;
  }
  document.getElementById('q').addEventListener('input', draw);
  const pub = VX.cachedPublic(); if (pub && pub.courses && pub.courses.length) ALL = pub.courses;
  draw();
  VX.publicData().then(d => { if (d.courses && d.courses.length) { ALL = d.courses; draw(); } }).catch(() => {});
})();
</script>
<script src="assets/js/vector-i18n.js"></script>
<script src="assets/js/vector-i18n-dict.js"></script>
</body>
</html>
