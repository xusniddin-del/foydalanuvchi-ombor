<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECTOR — Barcha kurslar</title>
<meta name="theme-color" content="#1E63F0">
<link rel="icon" href="assets/img/vector-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body { background: #ECECEC; }
  main { max-width: 1280px; margin: 0 auto; padding: clamp(24px,3vw,40px) clamp(16px,4vw,48px) 72px; min-height: 70vh; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: clamp(20px,3vw,32px); }
  h1 { margin: 0; font-size: clamp(24px,2.6vw,32px); font-weight: 700; }
  .search { flex: 0 1 360px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: #fff; border: 1.5px solid #0F172A; border-radius: 999px; }
  .search .ms { font-size: 24px; color: #1E63F0; }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 15px; background: transparent; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,300px),1fr)); gap: clamp(16px,2vw,28px); }
  .card { background: #fff; border: 1.5px solid #D4D4D4; border-radius: 18px; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 10px; animation: vIn .5s cubic-bezier(.2,.7,.2,1) both; transition: transform .25s, box-shadow .25s; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(15,23,42,.12); }
  .card .img { aspect-ratio: 3/2; border-radius: 12px; overflow: hidden; background: #EAF2FF; border: 1.5px solid #CFD9EA; box-shadow: 0 4px 12px rgba(15,23,42,.08); }
  .card .img img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .card h2 { margin: 4px 0 0; font-size: 19px; font-weight: 700; padding-bottom: 10px; border-bottom: 1.5px solid #E2E2E2; }
  .t { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .t .ms { width: 28px; height: 28px; border-radius: 50%; background: #EAF2FF; color: #1E63F0; display: grid; place-items: center; font-size: 17px; flex: none; }
  .pr { font-size: 14px; color: #8A8A8A; }
  .pr strong { color: #0F172A; }
  .go { margin-top: 4px; display: grid; place-items: center; height: 42px; border-radius: 12px; background: #1E63F0; color: #fff; font-weight: 700; font-size: 15px; transition: background .2s, transform .2s; }
  .go:hover { background: #1552cf; color: #fff; transform: translateY(-1px); }
  .empty { padding: 60px 0; text-align: center; color: #64748B; font-size: 16px; margin: 0; }
</style>
</head>
<body>
<div class="page">
<header id="vh"></header>
<main>
  <div class="top">
    <h1>Barcha kurslar</h1>
    <label class="search"><span class="ms">search</span><input id="q" placeholder="Kurs qidirish" aria-label="Kurs qidirish"></label>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Hech narsa topilmadi.</p>
</main>
<footer id="vf"></footer>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const { esc, loggedIn } = VSite;
  const fmt = n => Number(n || 0).toLocaleString('en-US').replace(/,/g, '.') + " so'm";
  const safe = u => /^(https:\/\/|assets\/)/.test(String(u || '')) ? u : '';
  const SAMPLE = [['Kompyuter savodxonligi', 350000], ['AI kontent', 450000], ['Grafik dizayn', 450000], ['No Coding', 400000], ['Scratch', 350000], ['UI/UX dizayn', 400000], ['Kiber xavfsizlik', 600000]]
    .map(([title, price], i) => ({ title, price, image: 'assets/img/courses/kurs-' + (i + 1) + '.png', teacher: 'Xusniddin Sharofiddinov' }));
  let ALL = SAMPLE;
  function draw() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const list = q ? ALL.filter(c => c.title.toLowerCase().includes(q)) : ALL;
    document.getElementById('grid').innerHTML = list.map((c, i) => `<article class="card" style="animation-delay:${i * 40}ms">
      <div class="img">${safe(c.image) ? `<img src="${esc(c.image)}" alt="${esc(c.title)} kursi muqovasi" loading="lazy">` : ''}</div>
      <h2>${esc(c.title)}</h2>
      <div class="t"><span class="ms" aria-hidden="true">person</span>Ustoz: ${esc(c.teacher || 'Xusniddin Sharofiddinov')}</div>
      ${c.price ? `<div class="pr">Oflayn kurs narxi: <strong>${fmt(c.price)}</strong></div>` : ''}
      <a class="go" href="${loggedIn ? 'kabinet.html#kurslar' : 'kirish.html?mode=register'}">Kursga yozilish</a></article>`).join('');
    document.getElementById('empty').hidden = list.length > 0;
  }
  document.getElementById('q').addEventListener('input', draw);
  const pub = VX.cachedPublic(); if (pub && pub.courses && pub.courses.length) ALL = pub.courses;
  draw();
  VX.publicData().then(d => { if (d.courses && d.courses.length) { ALL = d.courses; draw(); } }).catch(() => {});
})();
</script>
<script src="assets/js/vector-i18n.js"></script>
<script src="assets/js/vector-i18n-dict.js"></script>
</body>
</html>
