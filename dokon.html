<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECTOR — Do'kon</title>
<meta name="theme-color" content="#1E63F0">
<link rel="icon" href="assets/img/vector-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .coins { display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--orange-l); border: var(--line); border-radius: 16px; box-shadow: var(--sh-s); font-weight: 800; }
  .coins strong { font-family: var(--display); font-size: 20px; }
  .tabs { display: inline-flex; gap: 4px; padding: 5px; background: var(--white); border: var(--line); border-radius: 16px; }
  .tabs button { border: 0; cursor: pointer; padding: 8px 16px; border-radius: 11px; font-weight: 800; font-size: 15px; background: transparent; color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,230px),1fr)); gap: 24px; }
  .card { background: var(--white); border: var(--line); border-radius: 22px; box-shadow: var(--sh); padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 8px; animation: vIn .4s ease-out both; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translate(-3px,-3px); box-shadow: 9px 9px 0 var(--ink); }
  .card .img { aspect-ratio: 1; border-radius: 14px; border: 2.5px solid var(--ink); background: #fff; padding: 12px; display: grid; place-items: center; overflow: hidden; }
  .card .img img { display: block; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  .card h3 { margin: 6px 0 0; font-size: 17px; line-height: 1.25; }
  .card p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted); min-height: 39px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row .price { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 800; font-size: 17px; }
  .row small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .buy { width: 100%; margin-top: 6px; min-height: 44px; }
  .buy[disabled] { background: #E3E7F1; color: var(--muted); box-shadow: none; cursor: default; transform: none; }
  .soon { padding: clamp(24px,4vw,48px) 20px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; border: 3px dashed var(--ink); border-radius: 26px; background: var(--white); }
  .soon img { display: block; width: clamp(160px,20vw,230px); height: auto; }
  .soon h2 { margin: 8px 0 0; font-weight: 800; font-size: clamp(22px,2.6vw,30px); }
  .soon p { margin: 0; max-width: 520px; color: var(--ink-2); font-size: 17px; }
  .bar2 { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="page">
<header id="vh"></header>
<main class="inner" aria-label="Do'kon">
  <div class="inner-top">
    <div>
      <h1>Sovg'alar do'koni</h1><p>Darslarda to'plagan coinlaringizni haqiqiy sovg'alarga almashtiring.</p>
      <div class="bar2"><div class="coins"><i class="coin-i"></i>Sizda: <strong id="coins">0</strong></div>
      <div class="tabs" role="tablist" aria-label="Bo'limlar" id="tabs"><button role="tab" aria-selected="true" data-t="sovga">Sovg'a</button><button role="tab" aria-selected="false" data-t="oshxona">Oshxona</button><button role="tab" aria-selected="false" data-t="markaz">Markaz</button></div></div>
    </div>
    <label class="search"><span class="ms">search</span><input id="q" placeholder="Qidirish" aria-label="Sovg'alarni qidirish"></label>
  </div>
  <div class="grid" id="grid"></div>
  <div class="soon" id="soon" hidden><img src="assets/img/cat-empty.png" alt="Hayron mushukcha — Vector maskoti"><h2 id="soonT"></h2><p>Darslarda faol ishtirok etib coinlar to'plang va ularni do'kondagi sovg'alarga ega bo'ling</p></div>
</main>
<footer id="vf"></footer>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const { esc, loggedIn } = VSite;
  const fmt = n => Number(n || 0).toLocaleString('en-US').replace(/,/g, ' ');
  const safe = u => /^(https:\/\/|assets\/)/.test(String(u || '')) ? u : '';
  const G = [["Vector to'plami", "Futbolka, kepka, termos, sumka va stikerlar", 3000, 20], ['Kepka', 'Vector logosi tushirilgan kepka', 2000, 20], ['Termos', 'Vector logosi tushirilgan termos', 2000, 20],
    ['Simsiz sichqoncha', 'Bluetooth, RGB yoritgichli sichqoncha', 3500, 20], ['Mexanik klaviatura', 'RGB yoritgichli ixcham klaviatura', 6000, 15], ['Planshet', "Klaviatura va sichqoncha bilan to'plam", 25000, 5],
    ['Redmi A5 smartfon', "Kundalik o'qish uchun smartfon", 30000, 5], ['Noutbuk', "O'qish va dasturlash uchun noutbuk", 80000, 3]];
  let ALL = G.map(([name, desc, price, stock], i) => ({ id: 'g' + i, name, desc, price, stock, category: 'sovga', image: 'assets/img/gifts/g' + String(i + 1).padStart(2, '0') + '.png' }));
  let tab = 'sovga', coins = 0;
  const TITLES = { oshxona: 'Oshxona', markaz: 'Markaz', sovga: "Sovg'alar" };
  function draw() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const list = ALL.filter(p => (p.category || 'sovga') === tab).filter(p => !q || (p.name + ' ' + p.desc).toLowerCase().includes(q));
    document.getElementById('grid').innerHTML = list.map((g, i) => `<article class="card" style="animation-delay:${i * 30}ms">
      <div class="img">${safe(g.image) ? `<img src="${esc(g.image)}" alt="${esc(g.name)}" loading="lazy">` : ''}</div>
      <h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p>
      <div class="row"><span class="price"><i class="coin-i"></i>${fmt(g.price)}</span><small>${Number(g.stock) || 0} dona qoldi</small></div>
      <button class="btn btn-orange buy" data-id="${esc(g.id)}" ${g.stock > 0 ? '' : 'disabled'}>${g.stock > 0 ? 'Sotib olish' : 'Tugagan'}</button></article>`).join('');
    const soon = document.getElementById('soon');
    soon.hidden = list.length > 0;
    document.getElementById('soonT').textContent = q ? 'Hech narsa topilmadi' : TITLES[tab] + ' hali yaratilmagan';
    document.querySelectorAll('.buy').forEach(b => b.onclick = () => {
      if (!loggedIn) return VSite.gate("Sovg'ani olish uchun ro'yxatdan o'ting", "Sovg'alar Vector coinlari evaziga beriladi. Akkaunt oching, darslarda coin to'plang va sovg'alarni qo'lga kiriting.");
      location.href = 'kabinet.html#dokon';
    });
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b)); draw(); });
  document.getElementById('q').addEventListener('input', draw);
  const pub = VX.cachedPublic(); if (pub && pub.products && pub.products.length) ALL = pub.products;
  draw();
  VX.publicData().then(d => { if (d.products) { ALL = d.products; draw(); } }).catch(() => {});
  if (loggedIn) VX.call('me').then(r => { coins = r.user.coins; document.getElementById('coins').textContent = fmt(coins); }).catch(() => {});
})();
</script>
<script src="assets/js/vector-i18n.js"></script>
<script src="assets/js/vector-i18n-dict.js"></script>
</body>
</html>
