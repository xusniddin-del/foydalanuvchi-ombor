<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECTOR — onlayn ta'lim platformasi</title>
<meta name="theme-color" content="#1E63F0">
<link rel="icon" href="assets/img/vector-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  :root { --k-bg: #EFF4FC; --k-card: #fff; --k-ink: #0F172A; --k-ink2: #334155; --k-muted: #64748B; --k-soft: #F1F5FB; --k-line: #E2E8F0; --k-blue: #1E63F0; --k-blue-l: #EAF2FF; --k-navy: #0B1E4F; --k-orange: #FF8A00; --k-orange-l: #FFF3E3; }
  [data-theme="dark"] { --k-bg: #0A1120; --k-card: #111B2F; --k-ink: #E8EEF8; --k-ink2: #C3CEDF; --k-muted: #94A3B8; --k-soft: #16223A; --k-line: #22304A; --k-blue-l: #16233E; --k-orange-l: #3A2610; }
  body { background: var(--k-bg); color: var(--k-ink); font-family: Inter, system-ui, sans-serif; }
  .k-main { max-width: 1216px; margin: 0 auto; padding: 32px 16px 80px; min-height: 70vh; }
  #view:focus { outline: none; }
  .k-card { background: var(--k-card); border-radius: 22px; }
  .k-pad { padding: 24px 28px; }
  .k-h1 { margin: 0; font-size: clamp(24px, 2.6vw, 30px); font-weight: 800; color: var(--k-ink); letter-spacing: -.01em; }
  .k-sub { margin: 6px 0 0; color: var(--k-muted); font-size: 15px; }
  .ms.f { font-variation-settings: 'FILL' 1; }
  .k-coin { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
  .k-coin::before { content: 'S'; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFC765, #FF9500 70%); color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.5); }
  .k-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 24px; border: 0; border-radius: 14px; font: 700 16px Inter, system-ui, sans-serif; cursor: pointer; text-decoration: none; transition: background .2s, transform .15s, box-shadow .2s; }
  .k-btn:active { transform: translateY(1px); }
  .k-btn[disabled] { opacity: .55; cursor: not-allowed; }
  .k-btn.or { background: var(--k-orange); color: #fff; } .k-btn.or:hover { background: #F07F00; color: #fff; }
  .k-btn.bl { background: var(--k-blue); color: #fff; } .k-btn.bl:hover { background: #1552CF; color: #fff; }
  .k-btn.ln { background: var(--k-card); color: var(--k-blue); box-shadow: inset 0 0 0 1.5px var(--k-blue); } .k-btn.ln:hover { background: var(--k-blue-l); }
  .k-btn.gr { background: var(--k-soft); color: var(--k-ink2); } .k-btn.gr:hover { background: var(--k-line); }
  .k-btn.sm { min-height: 40px; padding: 8px 16px; font-size: 15px; border-radius: 12px; }
  .k-btn.full { width: 100%; }
  .k-search { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; background: var(--k-soft); border-radius: 14px; color: var(--k-muted); }
  .k-search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 500 16px Inter, system-ui; color: var(--k-ink); }
  .k-search:focus-within { box-shadow: 0 0 0 2px var(--k-blue); }
  .k-empty { padding: 48px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--k-muted); }
  .k-empty img { width: 170px; }
  .k-empty b { font-size: 21px; color: var(--k-ink); }
  .k-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--k-blue-l); color: var(--k-blue); }
  .k-badge.or { background: var(--k-orange-l); color: #E07800; } .k-badge.gn { background: #E3F8EC; color: #12A150; } .k-badge.rd { background: #FDECEC; color: #E5484D; } .k-badge.gy { background: var(--k-soft); color: var(--k-muted); }
  .k-back { display: inline-flex; align-items: center; gap: 6px; color: var(--k-muted); font-weight: 600; margin-bottom: 16px; }
  .k-back:hover { color: var(--k-blue); }
  .k-progress { height: 8px; background: var(--k-soft); border-radius: 99px; overflow: hidden; }
  .k-progress > i { display: block; height: 100%; background: var(--k-blue); border-radius: inherit; }

  /* ---- kurslar ---- */
  .k-top { display: flex; align-items: center; gap: 16px; padding: 18px 24px; flex-wrap: wrap; }
  .k-top .ico { width: 48px; height: 48px; border-radius: 14px; background: var(--k-blue-l); color: var(--k-blue); display: grid; place-items: center; flex: none; }
  .k-top .ico .ms { font-size: 26px; }
  .k-top h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .k-top small { color: var(--k-muted); font-size: 13px; }
  .k-top .k-search { margin-left: auto; flex: 0 1 420px; }
  .k-lockbar { margin-top: 26px; display: flex; align-items: center; gap: 14px; padding: 16px 20px 16px 24px; background: var(--k-navy); color: #fff; border-radius: 18px; flex-wrap: wrap; }
  .k-lockbar .ms { color: #FFB347; font-size: 26px; }
  .k-lockbar p { margin: 0; flex: 1 1 260px; font-weight: 600; }
  .k-cgrid { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 24px; }
  .k-course { background: var(--k-card); border-radius: 22px; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px; color: var(--k-ink); transition: transform .2s, box-shadow .2s; }
  .k-course:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(11,30,79,.12); color: var(--k-ink); }
  .k-course .img { position: relative; aspect-ratio: 3/2; border-radius: 16px; overflow: hidden; background: #0A1B4A; }
  .k-course .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .k-course .lock { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--k-orange); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .k-course .lock .ms { font-size: 20px; }
  .k-course h3 { margin: 4px 8px 0; font-size: 19px; font-weight: 700; }
  .k-teacher { margin: 0 8px; display: flex; align-items: center; gap: 10px; color: var(--k-ink2); font-size: 15px; }
  .k-teacher i { width: 28px; height: 28px; border-radius: 50%; background: var(--k-blue-l); color: var(--k-blue); display: grid; place-items: center; font-style: normal; }
  .k-teacher i .ms { font-size: 18px; }
  .k-course .prog { margin: 0 8px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--k-muted); }
  .k-course .prog .k-progress { flex: 1; }
  .k-course .k-btn { margin: 4px 4px 0; }

  /* kurs va dars */
  .k-chead { display: grid; grid-template-columns: minmax(0, 340px) 1fr; gap: 24px; padding: 14px; align-items: center; }
  .k-chead .img { border-radius: 16px; overflow: hidden; aspect-ratio: 3/2; background: #0A1B4A; }
  .k-chead .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 720px) { .k-chead { grid-template-columns: 1fr; } }
  .k-lessons { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
  .k-lesson { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--k-card); border-radius: 18px; color: var(--k-ink); transition: box-shadow .2s; }
  a.k-lesson:hover { box-shadow: 0 0 0 2px var(--k-blue); color: var(--k-ink); }
  .k-lesson .n { width: 44px; height: 44px; border-radius: 50%; background: var(--k-blue-l); color: var(--k-blue); display: grid; place-items: center; font-weight: 800; flex: none; }
  .k-lesson.done .n { background: #E3F8EC; color: #12A150; }
  .k-lesson.locked { opacity: .6; }
  .k-lesson .t { flex: 1; min-width: 0; }
  .k-lesson .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .k-lesson .t span { color: var(--k-muted); font-size: 13px; }
  .k-video { aspect-ratio: 16/9; border-radius: 22px; overflow: hidden; background: #0B1430; display: grid; place-items: center; color: #9FB3D9; }
  .k-video iframe { width: 100%; height: 100%; border: 0; }
  .k-q { padding: 18px 20px; border-radius: 18px; border: 1.5px solid var(--k-line); margin: 0; }
  .k-q h4 { margin: 0 0 12px; font-size: 16px; }
  .k-q.good { border-color: #12A150; background: #E3F8EC; } .k-q.bad { border-color: #E5484D; background: #FDECEC; }
  [data-theme="dark"] .k-q.good { background: #0F2E22; } [data-theme="dark"] .k-q.bad { background: #3A1616; }
  .k-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--k-line); cursor: pointer; margin-top: 8px; background: var(--k-card); }
  .k-opt:hover { border-color: var(--k-blue); }
  .k-opt input { width: 18px; height: 18px; accent-color: var(--k-blue); }
  .k-opt:has(input:checked) { border-color: var(--k-blue); background: var(--k-blue-l); }

  /* ---- premium ---- */
  .k-ptop { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .k-ptop .left { display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--k-card); border-radius: 16px; font-size: 15px; color: var(--k-ink2); }
  .k-ptop .left .ms { color: var(--k-orange); }
  .k-ptop .left b { color: var(--k-orange); }
  .k-phead { text-align: center; margin: 44px auto 0; max-width: 680px; }
  .k-phead h2 { margin: 0; font-size: clamp(30px, 4vw, 44px); font-weight: 800; color: var(--k-blue); letter-spacing: -.01em; }
  .k-phead p { margin: 14px 0 0; color: var(--k-ink2); font-size: 17px; line-height: 1.55; }
  .k-tog { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 6px; background: var(--k-card); border-radius: 999px; margin: 28px auto 0; box-shadow: 0 6px 20px rgba(11,30,79,.06); }
  .k-tog button { border: 0; background: transparent; border-radius: 999px; padding: 12px 30px; font: 700 16px Inter, system-ui; color: var(--k-ink); cursor: pointer; }
  .k-tog button[aria-pressed="true"] { background: var(--k-blue); color: #fff; }
  .k-plans { margin-top: 42px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; align-items: stretch; }
  @media (max-width: 960px) { .k-plans { grid-template-columns: 1fr; max-width: 460px; margin-left: auto; margin-right: auto; } }
  .k-plan { position: relative; background: var(--k-card); border-radius: 26px; padding: 34px 26px 26px; display: flex; flex-direction: column; border: 2px solid transparent; }
  .k-plan.pop { border-color: var(--k-orange); }
  .k-plan .tag { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--k-orange); color: #fff; font-size: 13px; font-weight: 700; padding: 4px 14px; border-radius: 999px; white-space: nowrap; }
  .k-plan .nm { align-self: center; min-width: 180px; text-align: center; padding: 6px 20px; background: var(--k-blue); color: #fff; border-radius: 999px; font-weight: 800; font-size: 19px; letter-spacing: .03em; }
  .k-plan .old { margin-top: 18px; text-align: center; color: #94A3B8; text-decoration: line-through; font-size: 14px; min-height: 20px; }
  .k-plan .price { text-align: center; font-size: clamp(32px, 3.4vw, 40px); font-weight: 800; color: var(--k-blue); line-height: 1.1; white-space: nowrap; }
  .k-plan .per { text-align: center; color: var(--k-muted); font-size: 13.5px; margin-top: 6px; }
  .k-plan hr { border: 0; border-top: 1px solid var(--k-line); margin: 24px 0 20px; width: 100%; }
  .k-plan ul { list-style: none; margin: 0 0 28px; padding: 0; display: flex; flex-direction: column; gap: 18px; flex: 1; }
  .k-plan li { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; color: var(--k-ink); }
  .k-plan li .ms { color: var(--k-blue); font-size: 22px; flex: none; }
  /* to'lov oynasi */
  .modal.k-mod { width: min(480px, 100%); padding: 22px; background: var(--k-bg); border-radius: 26px; }
  .k-mh { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .k-mh h2 { margin: 0 !important; font-size: 21px !important; font-weight: 800; }
  .k-x { width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--k-card); color: var(--k-ink); cursor: pointer; display: grid; place-items: center; }
  .k-sel { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--k-card); border: 1.5px solid var(--k-blue); border-radius: 18px; }
  .k-sel i { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #2A6BF2, #0D3FB5); display: grid; place-items: center; flex: none; }
  .k-sel i img { width: 30px; }
  .k-sel b { display: block; font-size: 16px; } .k-sel small { color: var(--k-muted); }
  .k-seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--k-card); border-radius: 14px; margin-top: 12px; }
  .k-seg2 button { border: 0; background: transparent; border-radius: 10px; height: 42px; font: 700 15px Inter, system-ui; color: var(--k-ink); cursor: pointer; }
  .k-seg2 button[aria-pressed="true"] { background: var(--k-blue); color: #fff; }
  .k-sum { margin-top: 12px; background: var(--k-card); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
  .k-sum .r { display: flex; justify-content: space-between; gap: 10px; color: var(--k-ink2); }
  .k-sum .r b { color: var(--k-ink); }
  .k-sum .tot { border-top: 1px solid var(--k-line); padding-top: 12px; margin-top: 4px; align-items: center; }
  .k-sum .tot b { font-size: 26px; color: var(--k-blue); }
  .k-pm-h { margin: 18px 0 10px; font-weight: 700; }
  .k-pm { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
  .k-pm button { height: 56px; border-radius: 14px; border: 1.5px solid var(--k-line); background: var(--k-card); cursor: pointer; font: 800 18px Inter, system-ui; }
  .k-pm button[aria-pressed="true"] { border-color: var(--k-blue); box-shadow: 0 0 0 1px var(--k-blue); }
  .k-pm .payme { color: #00BAC1; } .k-pm .click { color: #0A6CFF; } .k-pm .card { color: var(--k-ink); font-size: 15px; }
  .k-mact { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .k-mact .k-btn { width: 100%; }
  .k-bank { padding: 18px 20px; border-radius: 18px; background: linear-gradient(120deg, #1E63F0, #0B2A7A); color: #fff; display: flex; flex-direction: column; gap: 6px; }
  .k-bank .num { font-size: clamp(20px, 5vw, 26px); font-weight: 800; letter-spacing: .06em; }
  .k-bank .row2 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-end; font-weight: 600; }
  .k-bank .row2 b { font-size: 18px; }
  .k-steps { margin: 12px 0 0; padding: 14px 18px 14px 34px; background: var(--k-card); border-radius: 16px; line-height: 1.7; font-size: 14.5px; color: var(--k-ink2); }
  .k-up { margin-top: 12px; display: flex; align-items: center; gap: 14px; padding: 14px; border: 1.5px dashed #B8C6DE; border-radius: 16px; background: var(--k-card); cursor: pointer; }
  .k-up i { width: 48px; height: 48px; border-radius: 12px; background: var(--k-blue-l); color: var(--k-blue); display: grid; place-items: center; flex: none; overflow: hidden; }
  .k-up i img { width: 100%; height: 100%; object-fit: cover; }
  .k-up b { display: block; } .k-up small { color: var(--k-muted); }

  /* ---- do'kon ---- */
  .k-shoptop { display: flex; align-items: center; gap: 20px; padding: 16px 24px; flex-wrap: wrap; }
  .k-bal { display: flex; align-items: center; gap: 14px; min-width: 200px; }
  .k-bal i { width: 48px; height: 48px; border-radius: 14px; background: var(--k-orange-l); display: grid; place-items: center; font-style: normal; }
  .k-bal i::before { content: '$'; width: 28px; height: 28px; border-radius: 50%; background: #FF9500; color: #fff; display: grid; place-items: center; font-weight: 800; }
  .k-bal small { color: var(--k-muted); font-size: 13px; display: block; }
  .k-bal b { font-size: 24px; font-weight: 800; } .k-bal b span { font-size: 16px; font-weight: 500; color: var(--k-ink2); }
  .k-tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--k-soft); border-radius: 14px; }
  .k-tabs button { border: 0; background: transparent; padding: 10px 20px; border-radius: 10px; font: 600 15px Inter, system-ui; color: var(--k-ink2); cursor: pointer; }
  .k-tabs button[aria-selected="true"] { background: var(--k-card); color: var(--k-blue); box-shadow: 0 2px 8px rgba(11,30,79,.08); }
  .k-shoptop .k-search { flex: 1 1 260px; }
  @media (max-width: 640px) { .k-shoptop { padding: 16px; gap: 14px; } .k-shoptop .k-tabs { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); } .k-shoptop .k-search { flex: 1 1 0; min-width: 0; } .k-tog button { padding: 12px 18px; font-size: 15px; white-space: nowrap; } }
  .k-cart { width: 52px; height: 52px; border: 0; border-radius: 14px; background: var(--k-blue); color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; }
  .k-pgrid { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 255px), 1fr)); gap: 22px; }
  .k-prod { background: var(--k-card); border-radius: 22px; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .k-prod .img { position: relative; aspect-ratio: 1; border-radius: 16px; background: #EEF4FF; display: grid; place-items: center; overflow: hidden; }
  .k-prod .img img { width: 88%; height: 88%; object-fit: contain; mix-blend-mode: multiply; }
  [data-theme="dark"] .k-prod .img { background: #fff; }
  .k-prod .stock { position: absolute; top: 12px; left: 12px; background: #fff; color: #0F172A; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .k-prod h3 { margin: 8px 6px 0; font-size: 18px; font-weight: 700; }
  .k-prod p { margin: 0 6px; color: var(--k-muted); font-size: 13.5px; line-height: 1.4; min-height: 38px; }
  .k-prod .row3 { margin: 8px 6px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .k-prod .row3 .k-coin { font-size: 19px; }
  .k-prod .row3 .k-btn { min-height: 42px; padding: 8px 16px; font-size: 15px; border-radius: 12px; }

  /* ---- liderlar ---- */
  .k-lead { max-width: 880px; margin: 0 auto; }
  .k-podium { margin-top: 26px; background: linear-gradient(160deg, #2F76F6, #1E63F0); border-radius: 26px; padding: 34px 32px 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: end; overflow: hidden; }
  .k-pod { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; text-align: center; min-width: 0; }
  .k-pod .av { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: #fff; border: 4px solid #fff; overflow: hidden; }
  .k-pod .av img { width: 100%; height: 100%; object-fit: cover; }
  .k-pod.p1 .av { width: 92px; height: 92px; border-color: #FFC21A; background: #1E63F0; }
  .k-pod.p2 .av { background: #FF8A00; } .k-pod.p3 .av { background: #0B1E4F; border-color: #FF8A00; }
  .k-pod b { font-size: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .k-pod .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.2); padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .k-pod .chip.k-coin::before { width: 16px; height: 16px; font-size: 9px; }
  .k-pod .blk { width: 100%; margin-top: 10px; background: rgba(255,255,255,.25); border-radius: 18px 18px 0 0; display: grid; place-items: center; font-size: 44px; font-weight: 800; }
  .k-pod.p1 .blk { height: 150px; } .k-pod.p2 .blk { height: 110px; } .k-pod.p3 .blk { height: 80px; }
  @media (max-width: 560px) { .k-podium { padding: 24px 12px 0; gap: 8px; } .k-pod .av { width: 56px; height: 56px; font-size: 22px; } .k-pod.p1 .av { width: 68px; height: 68px; } .k-pod b { font-size: 13px; } .k-pod .blk { font-size: 30px; } }
  .k-meRow { margin-top: 24px; display: flex; align-items: center; gap: 16px; padding: 16px 24px; background: var(--k-navy); color: #fff; border-radius: 18px; }

<body>
<div class="page">
<header id="vh"></header>
<main class="k-main"><div id="view" tabindex="-1"><div class="skeleton" style="height:90px;border-radius:22px"></div><div class="skeleton" style="height:340px;margin-top:24px;border-radius:22px"></div></div></main>
<footer id="vf"></footer>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  'use strict';
  if (!VX.token()) { location.replace('kirish.html'); return; }
  const { esc, num, date, dateTime, daysLeft, safeUrl, toast, modal, busy, call } = VX;
  const $ = s => document.querySelector(s);
  const view = $('#view');
  let ME = null, STATS = null, PUB = VX.cachedPublic();
  const ms = (n, f) => `<span class="ms${f ? ' f' : ''}" aria-hidden="true">${n}</span>`;
  const sum = n => Number(n || 0).toLocaleString('en-US').replace(/,/g, '.');
  const fmt = n => sum(n) + " so'm";
  const coin = (n, cls) => `<span class="k-coin ${cls || ''}">${sum(n)}</span>`;
  const set = () => (PUB && PUB.settings) || {};
  const tgName = () => String(set().telegram || 'vectoradminn').replace(/^@/, '');
  const LG = () => (window.vectorLang && vectorLang()) || 'uz';
  const tx = (uz, ru, en) => { const l = LG(); return l === 'ru' ? ru : l === 'en' ? en : uz; };
  const COLORS = ['#1E63F0', '#FF8A00', '#12A150', '#7A5AF8', '#E5484D', '#0EA5E9', '#DB2777', '#0B1E4F'];
  const avColor = n => COLORS[(String(n || '?').charCodeAt(0) || 0) % COLORS.length];
  const first = n => String(n || '').trim().split(/\s+/)[0] || '';
  const av = (u, cls, bg) => `<span class="${cls || 'k-av'}" style="background:${bg || avColor(u && u.name)}">${safeUrl(u && u.avatar) ? `<img src="${esc(u.avatar)}" alt="">` : esc((first(u && u.name)[0] || '?').toUpperCase())}</span>`;
  const TG_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9-8.2c.4-.4-.1-.6-.6-.2L6.3 12.9l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.5 2.8c.9-.3 1.6.2 1.4 1.5z"/></svg>';

  // ---- tezkor kesh: avval saqlangan ma'lumot darhol ko'rsatiladi, yangisi orqada keladi ----
  const KP = 'vx_c_' + String(VX.token() || '').slice(-10) + '_', FRESH = {}, TTL = 20000;
  const ckey = (a, p) => KP + a + (p ? ':' + JSON.stringify(p) : '');
  const cget = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };
  const cput = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
  function drop() { const pre = [...arguments]; try { Object.keys(localStorage).forEach(k => { if (k.startsWith(KP) && pre.some(a => k.startsWith(KP + a))) { localStorage.removeItem(k); delete FRESH[k]; } }); } catch (_) {} }
  function clearCache() { try { Object.keys(localStorage).forEach(k => { if (k.startsWith('vx_c_')) localStorage.removeItem(k); }); } catch (_) {} }
  let ROUTE_ID = 0;
  /** Kesh bo'lsa darhol qaytaradi va orqada yangilaydi; yangisi farq qilsa sahifani jimgina qayta chizadi */
  function swr(action, params) {
    const k = ckey(action, params), old = cget(k), rid = ROUTE_ID;
    const fetchIt = () => call(action, params).then(r => { FRESH[k] = Date.now(); const changed = JSON.stringify(r) !== JSON.stringify(old); cput(k, r); return { r, changed }; });
    if (old && FRESH[k] && Date.now() - FRESH[k] < TTL) return Promise.resolve(old);
    if (old) { fetchIt().then(x => { if (x.changed && rid === ROUTE_ID) go(true); }).catch(() => {}); return Promise.resolve(old); }
    return fetchIt().then(x => x.r);
  }
  function prefetch() { ['courses', 'shop', 'plans'].forEach(a => { const k = ckey(a); if (!FRESH[k]) call(a).then(r => { FRESH[k] = Date.now(); cput(k, r); }).catch(() => {}); }); }

  function renderMe() {
    if (!ME) return;
    try { localStorage.setItem('vx_me', JSON.stringify({ name: ME.name, coins: ME.coins, avatar: ME.avatar })); } catch (_) {}
    if (window.VSite && VSite.paintMe) VSite.paintMe(ME);
  }
  async function loadMe() {
    const r = await swr('me', { lite: 1 });
    ME = r.user; VX.applyTheme(ME.theme); renderMe();
    return r;
  }
  function setCoins(c) { if (ME && c !== undefined && ME.coins !== c) { ME.coins = c; renderMe(); drop('me'); } }
  async function logout() { clearCache(); try { await call('logout'); } catch (_) {} VX.setToken(null); try { localStorage.removeItem('vx_me'); } catch (_) {} location.replace('index.html'); }
  function authFail(e) { if (e && (e.code === 'auth' || e.code === 'blocked')) { VX.setToken(null); toast(e.message, 'error'); setTimeout(() => location.replace('kirish.html'), 1200); return true; } return false; }

  // ================= PROFIL MA'LUMOTLARINI TO'LDIRISH OYNASI =================
  const REGIONS = ['Toshkent sh.', 'Toshkent vil.', 'Andijon', 'Buxoro', "Farg'ona", 'Jizzax', 'Xorazm', 'Namangan', 'Navoiy', 'Qashqadaryo', "Qoraqalpog'iston", 'Samarqand', 'Sirdaryo', 'Surxondaryo'];
  const GRADES = Array.from({ length: 11 }, (_, i) => (i + 1) + '-sinf').concat(['Talaba', 'Boshqa']);
  const missing = u => !!u && (!u.region || !u.school || !u.grade || !u.birthday);
  const gradeOf = u => /^\d+$/.test(u.grade || '') ? u.grade + '-sinf' : String(u.grade || '').replace(/^talaba$/, 'Talaba').replace(/^boshqa$/, 'Boshqa');
  const opt = (v, t, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(t)}</option>`;
  function placeFields(u) {
    const [reg0, ...rest] = String(u.region || '').split(', '), city = rest.join(', ');
    const regs = reg0 && !REGIONS.includes(reg0) ? [reg0, ...REGIONS] : REGIONS, g = gradeOf(u);
    const today = new Date().toISOString().slice(0, 10);
    return `<label class="k-f">Tug'ilgan sana<input type="date" name="birthday" value="${esc(u.birthday)}" min="1960-01-01" max="${today}"></label>
      <label class="k-f">Viloyat<select name="region"><option value="">Tanlang</option>${regs.map(r => opt(r, r, r === reg0)).join('')}</select></label>
      <label class="k-f">Shahar yoki tuman<input name="city" value="${esc(city)}" placeholder="Masalan: Marg'ilon"></label>
      <label class="k-f">Maktab<input name="school" value="${esc(u.school)}" placeholder="Masalan: 4-maktab"></label>
      <label class="k-f">Sinf<select name="grade"><option value="">Tanlang</option>${GRADES.map(x => opt(x, x, x === g)).join('')}</select></label>`;
  }
  function readPlace(f) {
    const city = f.city.value.trim(), b = f.birthday.value;
    if (b && (b > new Date().toISOString().slice(0, 10) || b < '1960-01-01')) throw new Error("Tug'ilgan sanani tekshiring.");
    return { region: f.region.value ? f.region.value + (city ? ', ' + city : '') : '', school: f.school.value.trim(), grade: f.grade.value, birthday: b };
  }
  function askProfile() {
    const bc = set().birthday_coins || 50;
    const m = modal(`<form id="pfAsk"><div class="k-mh"><div style="display:flex;gap:14px;align-items:center"><img src="assets/img/cat-happy.png" alt="" style="width:64px"><div><h2>Ma'lumotlaringizni to'ldiring</h2><p class="muted" style="margin:4px 0 0">Tug'ilgan kuningizda ${coin(bc)} sovg'a qilamiz!</p></div></div></div>
        <div class="k-form" style="grid-template-columns:1fr 1fr;margin-top:12px">${placeFields(ME)}</div>
        <p class="err" hidden style="margin-top:12px"></p>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button type="button" class="k-btn gr sm" data-later>Keyinroq</button><button class="k-btn bl sm" type="submit">Saqlash</button></div></form>`);
    const f = m.el.querySelector('#pfAsk'), er = f.querySelector('.err');
    f.querySelector('[data-later]').onclick = () => { try { sessionStorage.setItem('vx_pf_later', '1'); } catch (_) {} m.close(); };
    f.onsubmit = e => {
      e.preventDefault(); er.hidden = true;
      let data; try { data = readPlace(f); } catch (x) { er.textContent = x.message; er.hidden = false; return; }
      if (!data.region || !data.school || !data.grade || !data.birthday) { er.textContent = "Iltimos, barcha maydonlarni to'ldiring."; er.hidden = false; return; }
      busy(f.querySelector('[type=submit]'), async () => {
        const r = await call('profile', data); drop('me');
        ME = r.user; renderMe(); m.close(); toast("Rahmat! Ma'lumotlar saqlandi", 'success');
      }).catch(x => { er.textContent = x.message; er.hidden = false; });
    };
  }

  // ================= MARSHRUTLAR =================
  const ALIAS = { bosh: 'kurslar', obuna: 'premium', coin: 'bildirishnoma' };
  const routes = { kurslar: pCourses, kurs: pCourse, dars: pLesson, premium: pPremium, dokon: pShop, liderlar: pLeaders, bildirishnoma: pNotif, profil: pProfile };
  async function go(silent) {
    let [name, id] = (location.hash.replace('#', '') || 'kurslar').split('/');
    if (ALIAS[name]) { location.replace('#' + ALIAS[name]); return; }
    const fn = routes[name] || pCourses;
    if (silent === true) { if (name === 'dars' || document.querySelector('.modal-bg')) return; const y = scrollY; try { await fn(id); } catch (_) {} window.scrollTo(0, y); return; }
    ROUTE_ID++;
    view.innerHTML = '<div class="skeleton" style="height:90px;border-radius:22px"></div><div class="skeleton" style="height:340px;margin-top:24px;border-radius:22px"></div>';
    window.scrollTo(0, 0);
    try { await fn(id); } catch (e) {
      if (authFail(e)) return;
      view.innerHTML = `<div class="k-card k-empty"><img src="assets/img/cat-sad.png" alt=""><b>${esc(e.message)}</b><button class="k-btn bl sm" onclick="location.reload()">Qayta urinish</button></div>`;
    }
    view.focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', () => go());
  window.addEventListener('vector-lang', () => go());

  // ================= KURSLAR =================
  let Q = '';
  function courseCard(c, active) {
    const btn = !active ? `<span class="k-btn or full">${ms('lock', 1)}Premium bilan ochish</span>`

      <p class="k-sub" style="margin:0">${L.attempts ? 'Coinlar faqat birinchi urinishda beriladi. Qayta ishlab natijangizni yaxshilashingiz mumkin.' : "Diqqat bilan javob bering: coinlar faqat birinchi urinishdagi to'g'ri javoblar uchun beriladi."}</p>
      <form id="quiz" style="display:flex;flex-direction:column;gap:12px">${L.quiz.map((q, i) => `<fieldset class="k-q"><legend class="sr">Savol ${i + 1}</legend><h4>${i + 1}. ${esc(q.q)}</h4>${q.o.map((o, j) => `<label class="k-opt"><input type="radio" name="q${i}" value="${j}" required>${esc(o)}</label>`).join('')}</fieldset>`).join('')}
        <p class="err" hidden></p>
        <button class="k-btn bl" type="submit">Javoblarni yuborish</button></form></div>`;

          <h2>${res.correct}/${res.total} to'g'ri</h2>
          ${res.earned ? `<p style="font-size:22px;margin:0"><span class="k-coin">+${sum(res.earned)} coin</span></p>` : `<p class="muted">${res.first ? "Bu safar coin yo'q — keyingi darsda omad!" : 'Qayta urinishda coin berilmaydi.'}</p>`}
          <p class="muted">${perfect ? "Barakalla! Hammasi to'g'ri!" : "Qizil belgilangan savollarni qayta ko'rib chiqing."}</p>
          <div style="display:flex;gap:10px;margin-top:8px"><button class="k-btn gr sm" data-close>Yopish</button>${r.next ? `<a class="k-btn bl sm" href="#dars/${esc(r.next)}" data-close>Keyingi dars</a>` : `<a class="k-btn bl sm" href="#kurs/${esc(r.course.id)}" data-close>Kursga qaytish</a>`}</div></div>`);
        showNext();
        const b = f.querySelector('[type=submit]'); setTimeout(() => { b.textContent = 'Qayta ishlash'; }, 0);
        f.addEventListener('change', () => f.querySelectorAll('fieldset').forEach(fs => fs.classList.remove('good', 'bad')), { once: true });
      }).catch(err => toast(err.message, 'error'));
    });
  }

  // ================= PREMIUM (OBUNA) =================
  let PERIOD = 1;
  async function pPremium() {
    const r = await swr('plans');
    if (!PUB) PUB = await VX.publicData().catch(() => PUB) || PUB;
    const u = r.user, left = u.active ? daysLeft(u.subEnd) : 0;
    const names = [...new Set(r.plans.map(p => p.name))];
    const hasYear = r.plans.some(p => p.months > 1);
    if (!hasYear) PERIOD = 1;
    view.innerHTML = `<div class="k-ptop"><h1 class="k-h1">Ushbu obunalardan birini tanlang</h1><span class="left">${ms('schedule', 1)} Premium tugash muddati: <b>${left} kun</b></span></div>
      <div class="k-phead"><h2>Obunalar bilan tanishing</h2><p>O'zingizga qulay obuna muddatini tanlang. Oylik to'lov qiling yoki yillik obuna bilan 60% gacha mablag'ingizni tejab qoling!</p>
        ${hasYear ? `<div class="k-tog" id="tog"><button type="button" data-p="1" aria-pressed="${PERIOD === 1}">Oylik obunalar</button><button type="button" data-p="12" aria-pressed="${PERIOD !== 1}">Yillik obunalar</button></div>` : ''}</div>
      <div class="k-plans" id="plans"></div>`;
    const pick = (name, months) => r.plans.find(p => p.name === name && (months === 1 ? p.months === 1 : p.months > 1)) || r.plans.find(p => p.name === name);
    const draw = () => {
      $('#plans').innerHTML = names.map(n => {
        const p = pick(n, PERIOD); if (!p) return '';
        const save = p.oldPrice > p.price ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
        const per = p.months > 1 ? `yiliga${save ? ' · ' + save + '% tejaysiz' : ''}` : 'oyiga';
        return `<article class="k-plan ${p.popular ? 'pop' : ''}">${p.popular ? "<span class=\"tag\">Eng ko'p tanlanadi</span>" : ''}
          <span class="nm">${esc(p.name)}</span><div class="old">${p.oldPrice > p.price ? fmt(p.oldPrice) : ''}</div><div class="price">${fmt(p.price)}</div><div class="per">${per}</div><hr>
          <ul>${(p.features || []).map(f => `<li>${ms('check_circle', 1)}<span>${esc(f)}</span></li>`).join('')}</ul>
          <button class="k-btn or full" type="button" data-buy="${esc(p.name)}">Sotib olish</button></article>`;
      }).join('') || `<div class="k-card k-empty" style="grid-column:1/-1"><b>Tariflar hali qo'shilmagan</b></div>`;
      view.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => checkout(r, b.dataset.buy, pick));
    };
    view.querySelectorAll('#tog button').forEach(b => b.onclick = () => { PERIOD = Number(b.dataset.p); view.querySelectorAll('#tog button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
    draw();
  }

  function checkout(r, name, pick) {
    const st = set(), live = r.mode === 'live', hasCard = !!String(st.card_number || '').replace(/\D/g, '');
    let months = PERIOD, method = live ? (st.payme_merchant_id ? 'payme' : 'click') : 'card';
    const m = modal(`<div class="k-mh"><h2>Obunani rasmiylashtirish</h2><button class="k-x" type="button" data-close aria-label="Yopish">${ms('close')}</button></div><div id="ck"></div>`);
    m.el.classList.add('k-mod');
    const box = m.el.querySelector('#ck');
    const draw = () => {
      const p = pick(name, months), yearly = r.plans.some(x => x.name === name && x.months > 1) && r.plans.some(x => x.name === name && x.months === 1);
      const disc = p.oldPrice > p.price ? p.oldPrice - p.price : 0;
      const methods = live ? [st.payme_merchant_id && ['payme', 'Payme'], st.click_service_id && ['click', 'click']].filter(Boolean) : [['card', hasCard ? 'Kartaga o\'tkazma' : 'Admin orqali']];
      if (!methods.some(x => x[0] === method)) method = methods[0] ? methods[0][0] : '';
      box.innerHTML = `<div class="k-sel"><i><img src="assets/img/vector-logo-white.png" alt=""></i><div><b>Siz ${esc(p.name)} tarifini sotib olyapsiz</b><small>Tarif amal qilish muddati: ${p.months} oy</small></div></div>
        ${yearly ? `<div class="k-seg2"><button type="button" data-m="1" aria-pressed="${p.months === 1}">Oylik</button><button type="button" data-m="12" aria-pressed="${p.months > 1}">Yillik</button></div>` : ''}
        <div class="k-sum"><div class="r"><span>Obuna turi:</span><b>${p.months > 1 ? 'Yillik' : 'Oylik'}</b></div><div class="r"><span>To'lov summasi:</span><b>${fmt(p.oldPrice > p.price ? p.oldPrice : p.price)} UZS</b></div>
          <div class="r"><span>Chegirma</span><span class="k-badge gn">${sum(disc)} UZS</span></div><div class="r tot"><b style="font-size:17px;color:var(--k-ink)">Jami to'lovga:</b><b>${fmt(p.price)} UZS</b></div></div>
        <div class="k-pm-h">To'lov usulini tanlang</div>
        <div class="k-pm">${methods.map(([k, t]) => `<button type="button" class="${k}" data-pv="${k}" aria-pressed="${k === method}">${t}</button>`).join('') || '<p class="muted">To\'lov usullari hali ulanmagan.</p>'}</div>
        <div class="k-mact"><button class="k-btn bl" id="goPay" ${methods.length ? '' : 'disabled'}>Obuna bo'lish</button><button class="k-btn ln" data-close type="button">Bekor qilish</button></div>`;
      box.querySelectorAll('[data-close]').forEach(b => b.onclick = m.close);
      box.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { months = Number(b.dataset.m); draw(); });
      box.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => { method = b.dataset.pv; draw(); });
      $('#goPay').onclick = e => {
        if (method === 'card' && hasCard) return cardStep(p);
        busy(e.currentTarget, async () => {
          const res = await call('pay.create', { planId: p.id, provider: method });
          drop('payments');
          if (res.mode !== 'live') { m.close(); toast("So'rov yuborildi. Admin tasdiqlashini kuting.", 'success'); return; }
          const pay = res.payment, ret = st.return_url || (location.origin + location.pathname + '#premium');
          if (pay.provider === 'click') location.href = `https://my.click.uz/services/pay?service_id=${encodeURIComponent(st.click_service_id)}&merchant_id=${encodeURIComponent(st.click_merchant_id)}&amount=${pay.amount}&transaction_param=${encodeURIComponent(pay.id)}&return_url=${encodeURIComponent(ret)}`;
          else location.href = 'https://checkout.paycom.uz/' + btoa(`m=${st.payme_merchant_id};ac.order_id=${pay.id};a=${pay.amount * 100};c=${ret}`);
        }).catch(err => toast(err.message, 'error'));
      };
    };
    const cardStep = p => {
      const cardNo = String(st.card_number || '').replace(/\D/g, '').replace(/(\d{4})(?=\d)/g, '$1 ');
      let img = '';
      m.el.querySelector('.k-mh h2').textContent = "To'lov";
      box.innerHTML = `<div class="k-bank"><div style="display:flex;justify-content:space-between;opacity:.9;font-size:14px"><span>Karta raqami</span><b>${esc(p.name)}</b></div><div class="num">${esc(cardNo)}</div>
          <div class="row2"><span>${esc(st.card_holder || '')}</span><b>${fmt(p.price)}</b></div></div>
        <div style="display:flex;gap:10px;margin-top:12px"><button class="k-btn ln sm full" type="button" id="cpy">${ms('content_copy', 1)} Nusxalash</button></div>
        <ol class="k-steps"><li>Bank ilovangizda "Kartaga o'tkazma" bo'limini oching.</li><li>Karta raqamini qo'yib, ${fmt(p.price)} o'tkazing.</li><li>To'lov chekining rasmini quyida yuklang.</li></ol>
        <label class="k-up"><i id="upI">${ms('receipt_long', 1)}</i><span><b id="upT">To'lov chekini yuklang</b><small>JPG yoki PNG, 5 MB gacha</small></span><input type="file" accept="image/*" id="upF" class="sr"></label>
        <div class="k-mact"><button class="k-btn or" id="paid">To'ladim</button><button class="k-btn ln" type="button" id="bk">Orqaga</button></div>`;
      $('#bk').onclick = () => { m.el.querySelector('.k-mh h2').textContent = 'Obunani rasmiylashtirish'; draw(); };
      $('#cpy').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(cardNo.replace(/\s/g, '')) : Promise.reject()).then(() => toast('Karta raqami nusxalandi', 'success')).catch(() => toast(cardNo)); };
      $('#upF').onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        if (f.size > 5 * 1024 * 1024) return toast('Rasm 5 MB dan katta.', 'error');
        try { img = await VX.resizeImage(f, 1400, 0.82); $('#upI').innerHTML = `<img src="${img}" alt="">`; $('#upT').textContent = 'Chek tanlandi ✓'; } catch (x) { toast(x.message, 'error'); }
      };
      $('#paid').onclick = e => {
        if (!img) return toast("Avval to'lov chekining rasmini yuklang.", 'error');
        busy(e.currentTarget, async () => {
          const res = await call('pay.create', { planId: p.id, provider: 'test' });
          await call('pay.receipt', { id: res.payment.id, image: img }); drop('payments');
          m.close();
          modal(`<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px"><img src="assets/img/cat-happy.png" alt="" style="width:140px"><h2>Rahmat! Chek qabul qilindi</h2><p class="muted">Admin to'lovni tekshirib tasdiqlagach, Premium darhol ochiladi${ME && ME.tg ? ' va Telegram botga xabar keladi' : ''}.</p><button class="k-btn bl sm" data-close>Yaxshi</button></div>`);
        }).catch(err => toast(err.message, 'error'));
      };
    };
    draw();
  }

  function buy(s, p) {
    if (p.price > s.coins) { toast(`Coin yetarli emas: yana ${sum(p.price - s.coins)} coin kerak. Testlarni ishlab coin to'plang!`, 'error'); return; }
    const max = Math.min(10, p.stock, Math.floor(s.coins / p.price));
    const m = modal(`<div class="k-mh"><h2>${esc(p.name)}</h2><button class="k-x" type="button" data-close aria-label="Yopish">${ms('close')}</button></div>

    m.el.classList.add('k-mod');
    const q = m.el.querySelector('#qty');
    q.oninput = () => { m.el.querySelector('#tot').innerHTML = coin(p.price * Math.max(1, Math.min(max, Number(q.value) || 1))); };
    m.el.querySelector('#okBuy').onclick = e => busy(e.currentTarget, async () => {
      const r = await call('buy', { id: p.id, qty: Math.max(1, Math.min(max, Number(q.value) || 1)) }); drop('shop', 'orders', 'coins', 'me');

    let cat = 'all', q = '';
    box.innerHTML = `<h1 class="k-h1">Yordam</h1><label class="k-search" style="background:var(--k-card);margin-top:16px">${ms('search')}<input id="hq" type="search" placeholder="Savolingizni yozing" aria-label="Savolingizni yozing"></label>
      <div class="k-chips" id="hc">${[['all', 'Hammasi'], ['hisob', 'Hisob'], ['obuna', 'Obuna'], ['kurslar', 'Kurslar'], ['coin', "Coin va do'kon"], ['sertifikat', 'Sertifikat']].map(([k, t]) => `<button type="button" data-c="${k}" aria-pressed="${k === 'all'}">${t}</button>`).join('')}</div>
      <div class="k-card k-faq" id="hf"></div>
      <h2 style="margin:28px 0 0;font-size:20px;font-weight:800">Javob topmadingizmi?</h2>
      <div class="k-help"><a href="https://t.me/${esc(tgName())}" target="_blank" rel="noopener"><i style="background:#2AABEE">${ms('send', 1)}</i><span><b>Telegram yordam</b><small>@${esc(tgName())}</small></span></a>
        ${s.phone ? `<a href="tel:${esc(String(s.phone).replace(/[^+\d]/g, ''))}"><i style="background:#12A150">${ms('call', 1)}</i><span><b>Qo'ng'iroq qilish</b><small>${esc(s.phone)}</small></span></a>` : ''}
        <a href="#profil/taklif"><i style="background:#FF8A00">${ms('lightbulb', 1)}</i><span><b>Taklif yoki shikoyat</b><small>Jamoamizga to'g'ridan-to'g'ri yozing</small></span></a></div>`;
    const draw = () => {
      const list = F.filter(x => (cat === 'all' || x[0] === cat) && (!q || (x[2] + ' ' + x[3]).toLowerCase().includes(q)));
      $('#hf').innerHTML = list.map(x => `<details><summary><i>${ms(x[1], 1)}</i>${esc(x[2])}<span class="ms ch">expand_more</span></summary><p>${esc(x[3])}</p></details>`).join('') || '<p class="k-sub" style="padding:18px 0">Bunday savol topilmadi. Telegram orqali yozing.</p>';
    };
    $('#hq').oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; box.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
    draw();
  }

  function secRules(box) {
    const tg = tgName();
    const R = [['subscriptions', 'Obuna va kirish', "Platformadagi darslar pullik bo'lib, 1 oylik yoki 12 oylik obuna shaklida sotiladi. Muddat tugagach darslar vaqtincha yopiladi, to'lov qilinsa barcha progress tiklanadi. Obunalar avtomatik ravishda yechilmaydi (har safar o'zingiz to'laysiz)."],
      ['currency_exchange', 'Pulni qaytarish (Refund)', `Xarid qilingan kundan boshlab 7 kun ichida asosli sabab ko'rsatilsa, pul 100% to'liq qaytariladi (murojaat uchun: @${tg}).`],
      ['shield', 'Hisob xavfsizligi', "Har bir akkaunt shaxsiy bo'lishi shart va uni boshqalarga berish taqiqlanadi. Parol va xavfsizlik uchun foydalanuvchi o'zi to'liq mas'ul."],
      ['block', 'Foydalanish qoidalari', "Platformada spam tarqatish, noqonuniy kontent yuklash, birovning intellektual mulk huquqini buzish yoki dasturga qasddan zarar yetkazish qat'iyan taqiqlanadi. 12 oydan ortiq ishlatilmagan faol bo'lmagan akkauntlar o'chirib yuborilishi mumkin."],
      ['copyright', 'Intellektual mulk', "Saytdagi barcha materiallar va dasturiy ta'minot Vector'ga tegishli. Ularni ruxsatsiz ko'chirish, sotish yoki teskari muhandislik (reverse engineering) qilish mumkin emas."],
      ['balance', "Mas'uliyatni cheklash", "Xizmat \"bor holicha\" taqdim etiladi. Vector'ning har qanday holatdagi maksimal umumiy javobgarligi foydalanuvchi to'lagan obuna summasidan oshmaydi."]];
    box.innerHTML = `<div class="k-rules-h"><i>${ms('gavel', 1)}</i><div><b>Foydalanish shartlari</b><span style="opacity:.85">Platformadan foydalanishdan oldin tanishib chiqing</span></div></div>
      <div class="k-card k-pad k-sec">${R.map(([i, t, d]) => `<div class="k-rule"><i>${ms(i, 1)}</i><div><b>${t}</b><p>${esc(d)}</p></div></div>`).join('')}</div>
      <div class="k-sec" style="display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--k-orange-l);border:1.5px solid #FFD9A8;border-radius:16px;flex-wrap:wrap"><span class="ms f" style="color:var(--k-orange)">support_agent</span><span style="flex:1">Savollaringiz bo'lsa, adminga yozing</span><a class="k-btn or sm" href="https://t.me/${esc(tg)}" target="_blank" rel="noopener">@${esc(tg)}</a></div>`;
  }

  // ishga tushirish
  go();
  loadMe().then(() => {
    setTimeout(prefetch, 1500);
    let later = false; try { later = !!sessionStorage.getItem('vx_pf_later'); } catch (_) {}
    if (missing(ME) && !later) setTimeout(askProfile, 900);
  }).catch(e => { authFail(e); });
  VX.publicData().then(d => { PUB = d; }).catch(() => {});
})();
</script>
