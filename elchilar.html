<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECTOR — Elchilar</title>
<meta name="theme-color" content="#1E63F0">
<link rel="icon" href="assets/img/vector-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,230px),1fr)); gap: 26px; }
  .card { background: var(--white); border: var(--line); border-radius: 22px; box-shadow: var(--sh); padding: 12px 12px 18px; display: flex; flex-direction: column; gap: 6px; animation: vIn .4s ease-out both; }
  .card.lead { background: var(--lime); }
  .card .img { aspect-ratio: 3/2; border-radius: 14px; overflow: hidden; border: 2.5px solid var(--ink); background: var(--blue-l); margin-bottom: 6px; }
  .card .img img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card h2 { margin: 4px 0 4px; font-size: 16px; line-height: 1.25; }
  .card .r { display: flex; align-items: center; gap: 6px; font-size: 15px; }
  .card .r span:first-child { color: var(--muted); font-weight: 600; }
  .card .r strong { font-weight: 800; }
  .card.lead .r span:first-child { color: var(--ink-2); }
  .id { align-self: flex-start; margin-top: 6px; }
</style>
</head>
<body>
<div class="page">
<header id="vh"></header>
<main class="inner">
  <div class="inner-top"><div><h1>Elchilarimiz bilan tanishing</h1><p>Elchilar — maktablarida Vector haqida aytib, do'stlarini o'qishga taklif qiladigan faol o'quvchilar.</p></div></div>
  <div class="grid" id="grid"></div>
</main>
<footer id="vf"></footer>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const { esc } = VSite;
  const PEOPLE = [
    ['Saidkobilov Maxmudxon', 'Katta elchi', '18-maktab', '8-D'], ['Ergashev Sanjarbek', 'Elchi', '46-maktab', '7-A'], ['Abdullayev Muhammadumar', 'Elchi', '18-maktab', '7-D'],
    ['Ahadjonov Shohruhbek', 'Elchi', '28-maktab', '4-B'], ['Axadjonova Shahribonu', 'Elchi', '28-maktab', '7-D'], ['Kamoliddinova Xadichaxon', 'Elchi', '7-maktab', '6-D'],
    ['Vohhobjonova Shohsanam', 'Elchi', '1-maktab', '6-A'], ["Mansurxo'jayev Muhamadiso", 'Elchi', '29-maktab', '6-D'], ['Xasanov Muhammadsardor', 'Elchi', '8-maktab', '9-G'],
    ["A'zamjnov Abdulbori", 'Elchi', '18-maktab', '7-A']
  ];
  document.getElementById('grid').innerHTML = PEOPLE.map(([name, role, school, grade], i) => {
    const id = String(i + 1).padStart(3, '0'), lead = role === 'Katta elchi';
    return `<article class="card ${lead ? 'lead' : ''}" style="animation-delay:${i * 50}ms">
      <div class="img"><img src="assets/img/elchilar/e${id.slice(1)}.png" alt="${esc(name)}" loading="lazy"></div>
      <h2>${esc(name)}</h2>
      <div class="r"><span>Lavozim:</span><strong>${esc(role)}</strong>${lead ? '<span class="ms" aria-label="Tasdiqlangan" style="font-size:20px;color:var(--blue)">verified</span>' : ''}</div>
      <div class="r"><span>Maktab:</span><strong>${esc(school)}</strong></div>
      <div class="r"><span>Sinf:</span><strong>${esc(grade)} sinf o'quvchisi</strong></div>
      <span class="chip ${lead ? '' : 'blue'} id">ID ${id}</span></article>`;
  }).join('');
})();
</script>
<script src="assets/js/vector-i18n.js"></script>
<script src="assets/js/vector-i18n-dict.js"></script>
</body>
</html>
