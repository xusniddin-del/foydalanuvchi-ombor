<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vector</title>
<meta name="description" content="Vector — onlayn IT ta'lim: video darslar, testlar, Vector Coin va sovg'alar.">
<meta name="theme-color" content="#0a7aff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vector">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/vector-logo.png">
<link rel="apple-touch-icon" href="assets/img/app/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  :root { --a-bg: #f6f6f5; --a-card: #fff; --a-ink: #111; --a-ink2: #3f3f46; --a-muted: #7a7a7a; --a-line: #e6e6e6; --a-field: #c9c9c9; --a-blue: #0a7aff; --a-blue2: #0068e0; --a-blue-l: #eaf3ff; --a-orange: #ff8a00; --a-green: #22a55b; }
  html, body { height: 100%; }
  body { margin: 0; background: #e4e6ea; font-family: Inter, system-ui, -apple-system, sans-serif; color: var(--a-ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--a-blue); text-decoration: none; }
  img { max-width: 100%; }
  #app { position: relative; width: 100%; max-width: 440px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--a-bg); overflow-x: hidden; }
  @media (min-width: 480px) { #app { box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 20px 60px rgba(0,0,0,.12); } }
  body.vxd #app, body.vxd .tabbar, body.vxd .modal-bg .modal, body.vxd .toast { filter: invert(.9) hue-rotate(180deg); }
  body.vxd #app img, body.vxd #app iframe, body.vxd .modal img, body.vxd .keep { filter: invert(1) hue-rotate(180deg); }
  html.dark-bg body { background: #1b1b1b; }
  .scr { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; animation: aFade .25s ease-out; }
  @keyframes aFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes aUp { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes aLogo { 0% { transform: scale(.4) rotate(-12deg); opacity: 0; } 55% { transform: scale(1.08) rotate(2deg); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes aGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 0 18px rgba(255,255,255,.12); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .ph, .ph-fill { line-height: 1; }

  /* sarlavha */
  .top { background: var(--a-card); padding: calc(18px + env(safe-area-inset-top)) 20px 18px; flex: none; }
  .top.plain { background: transparent; }
  .back { width: 40px; height: 40px; margin-left: -10px; border: 0; background: transparent; cursor: pointer; font-size: 24px; color: #444; display: grid; place-items: center; }
  .top h1 { margin: 6px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .top h1.blue { color: var(--a-blue); font-size: 22px; font-weight: 700; }
  .top p { margin: 4px 0 0; font-size: 13px; color: var(--a-ink2); }
  .tophead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(16px + env(safe-area-inset-top)) 20px 14px; background: var(--a-card); }
  .tophead small { display: block; font-size: 13px; color: var(--a-ink2); }
  .tophead b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .bell { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--a-blue); color: #fff; display: grid; place-items: center; font-size: 22px; cursor: pointer; flex: none; }
  .bell i.n { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #ff3b30; border: 2px solid #fff; font: 700 10px Inter; display: grid; place-items: center; font-style: normal; }
  .body { flex: 1; padding: 16px 16px 120px; }
  .body.nobar { padding-bottom: 40px; }

  /* tugmalar va maydonlar */
  .btn { width: 100%; height: 48px; border-radius: 24px; border: 0; background: var(--a-blue); color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, opacity .15s; }
  .btn:active { background: #0056ba; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.ln { background: transparent; color: var(--a-blue); box-shadow: inset 0 0 0 1.5px var(--a-blue); }
  .btn.gr { background: #6b6b6b; }
  .btn.or { background: var(--a-orange); }
  .btn.tg { background: #2AABEE; }
  .btn.sm { height: 40px; font-size: 15px; border-radius: 12px; width: auto; padding: 0 16px; }
  .fl { display: block; }
  .fl > span { display: block; font-size: 13.5px; color: var(--a-muted); margin-bottom: 7px; }
  .in { width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--a-field); border-radius: 12px; background: var(--a-card); font-size: 16px; outline: none; }
  .in:focus { border-color: var(--a-blue); }
  textarea.in { height: auto; min-height: 90px; padding: 12px; resize: vertical; }
  .in[readonly] { background: #f0f0f0; color: #888; }
  .phone { display: flex; gap: 10px; }
  .phone .cc { height: 46px; padding: 0 10px; border: 1px solid var(--a-field); border-radius: 12px; background: var(--a-card); display: grid; place-items: center; font-size: 18px; font-weight: 600; flex: none; }
  .pw { position: relative; }
  .pw .in { padding-right: 50px; }
  .pw button { position: absolute; right: 4px; top: 3px; width: 40px; height: 40px; border: 0; background: transparent; color: #2153c4; font-size: 22px; cursor: pointer; display: grid; place-items: center; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .err { padding: 10px 12px; border-radius: 12px; background: #fdecec; color: #b42318; font-size: 14px; font-weight: 500; }
  .ok { padding: 10px 12px; border-radius: 12px; background: #e3f6ea; color: #157347; font-size: 14px; font-weight: 500; }
  .note { font-size: 13.5px; color: var(--a-muted); text-align: center; line-height: 1.4; margin: 0; }
  .card { background: var(--a-card); border-radius: 18px; }
  .pad { padding: 16px; }
  .muted { color: var(--a-muted); }
  .foot { margin-top: auto; padding: 16px 24px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .coin { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
  .coin::before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd27a, #ff9a00 60%, #e07800); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.45); flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #fff5e6; font-size: 13px; font-weight: 700; color: #b45309; }
  .pill.bl { background: var(--a-blue-l); color: var(--a-blue); } .pill.gn { background: #e3f6ea; color: #157347; } .pill.gy { background: #f0f0f0; color: #666; } .pill.rd { background: #fdecec; color: #b42318; }
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 20px; color: var(--a-muted); }
  .empty img { width: 170px; }
  .empty b { color: var(--a-ink); font-size: 19px; }
  .sk { background: linear-gradient(90deg, #eee 25%, #e2e2e2 50%, #eee 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 16px; }
  @keyframes sk { to { background-position: -200% 0; } }
  .sec-t { margin: 22px 4px 12px; font-size: 21px; font-weight: 700; }

  /* splash va tanishtiruv */
  /* kirish ekranlari: tungi ko'k uslub */
  .scr.auth { background: radial-gradient(90% 40% at 85% 0%, rgba(150,120,210,.55), transparent 70%), linear-gradient(180deg, #1a2466 0%, #0b1a4f 35%, #07103a 100%); color: #fff; }
  .auth .top { background: transparent; }
  .auth .top h1, .auth .top h1 span { color: #fff !important; }
  .auth .top p, .auth .note, .auth .fl > span { color: #9fb0d6; }
  .auth .back { color: #fff; }
  .auth .in, .auth .phone .cc, .auth .codes input { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); color: #fff; }
  .auth .in::placeholder { color: #6f7fa8; }
  .auth .in:focus, .auth .codes input:focus { border-color: #4c8dff; box-shadow: 0 0 0 3px rgba(76,141,255,.25); }
  .auth .pw button { color: #9fb0d6; }
  .auth .note a, .auth .forgot { color: #7fb0ff; }
  .auth .btn.gr { background: rgba(255,255,255,.1); }
  .auth .btn.ln { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.5); }
  .auth .tgbox { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
  .auth .tgbox p, .auth .tgstate { color: #b9c5e3; }
  .auth select.in option { color: #111; }
  .hero-in { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: calc(34px + env(safe-area-inset-top)) 18px 0 24px; min-height: 250px; }
  .hero-in h1 { margin: 0; font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; animation: aUp .5s ease-out both; }
  .hero-in p { margin: 10px 0 18px; font-size: 14px; line-height: 1.4; color: #b9c5e3; max-width: 190px; animation: aUp .5s ease-out .1s both; }
  .hero-in img { width: 168px; flex: none; margin-bottom: -6px; transform-origin: 50% 100%; animation: catIn .7s cubic-bezier(.2,1.3,.4,1) .15s both, catBob 3s ease-in-out 1s infinite; }
  @keyframes catIn { from { transform: translateY(40px) scale(.7); opacity: 0; } }
  @keyframes catBob { 50% { transform: translateY(-5px) rotate(-2deg); } }
  .panel { flex: 1; background: #081335; border-radius: 26px 26px 0 0; padding: 24px 24px calc(28px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(0,0,0,.25); }
  .panel .forgot { align-self: flex-end; margin-top: -6px; font-size: 14px; font-weight: 600; }
  .panel .btn { margin-top: 6px; }
  /* kirish animatsiyasi: mushuk chiqadi, esnaydi, ko'zini yopib uxlashga ketadi */
  .splash { position: fixed; inset: 0; z-index: 50; max-width: 440px; margin: 0 auto; overflow: hidden; color: #fff; text-align: center; cursor: pointer; transition: opacity .5s;
    background: radial-gradient(70% 45% at 85% 88%, rgba(120,150,230,.55), transparent 70%), radial-gradient(60% 40% at 10% 105%, rgba(70,100,200,.35), transparent 70%), linear-gradient(180deg, #0b1d5c 0%, #0a1850 45%, #07103a 100%); }
  .sp-top { position: absolute; left: 0; right: 0; top: calc(9vh + env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: center; gap: 10px; animation: aUp .6s ease-out .1s both; }
  .sp-top img { width: 48px; height: 48px; }
  .sp-top b { font-size: 38px; font-weight: 800; letter-spacing: .06em; line-height: 1; }
  .sp-top span { font-size: 15px; font-weight: 600; opacity: .85; }
  .sp-cat { position: absolute; left: 50%; bottom: -2px; width: min(78vw, 340px); margin-left: calc(min(78vw, 340px) / -2); transform: translateY(110%);
    animation: spUp 1s cubic-bezier(.2,1.25,.4,1) .6s forwards, spDown .75s cubic-bezier(.5,0,.8,.4) 4.05s forwards; }
  .sp-cat .body { position: relative; aspect-ratio: 280 / 395; transform-origin: 50% 100%; animation: spYawn 1.1s ease-in-out 1.7s both, spSettle .5s ease-in-out 3.2s both; }
  .sp-cat img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sp-mask { position: absolute; left: 30.7%; top: 28.4%; width: 44%; transform: rotate(36deg) translateY(-150%); animation: spMask .55s cubic-bezier(.3,.7,.4,1.1) 2.95s forwards; filter: drop-shadow(0 3px 4px rgba(0,0,40,.35)); }
  .sp-bub { position: absolute; left: -2%; top: 2%; padding: 8px 14px; border-radius: 16px 16px 16px 4px; background: #fff; color: #0b1d5c; font-weight: 700; font-size: 15px; white-space: nowrap; opacity: 0; transform: scale(.4); transform-origin: 0 100%; animation: spBub 1.4s ease-out 1.65s both; }
  .sp-z { position: absolute; left: 72%; top: 6%; font: 800 26px Inter; color: #cfe0ff; opacity: 0; animation: spZ 1.6s ease-out both; }
  .sp-z.z1 { animation-delay: 3.25s; } .sp-z.z2 { animation-delay: 3.55s; font-size: 20px; left: 80%; } .sp-z.z3 { animation-delay: 3.85s; font-size: 16px; left: 66%; }
  .sp-skip { position: absolute; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom)); font-size: 12px; opacity: .55; }
  @keyframes spUp { to { transform: translateY(16%); } }
  @keyframes spDown { from { transform: translateY(16%); } to { transform: translateY(115%); } }
  @keyframes spYawn { 0% { transform: none; } 30% { transform: scale(1.05, .95) rotate(-3deg); } 60% { transform: scale(.97, 1.06) rotate(3deg); } 100% { transform: none; } }
  @keyframes spSettle { 50% { transform: translateY(4%) scale(1.02, .97); } }
  @keyframes spMask { to { transform: rotate(36deg) translateY(0); } }
  @keyframes spBub { 0% { opacity: 0; transform: scale(.4); } 20%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.9); } }
  @keyframes spZ { 0% { opacity: 0; transform: translate(0, 10px) scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(26px, -70px) scale(1.2); } }
  @media (prefers-reduced-motion: reduce) { .sp-cat { transform: translateY(16%); } .sp-mask { transform: rotate(36deg); } }
  .ob-top { display: flex; justify-content: flex-end; padding: calc(28px + env(safe-area-inset-top)) 24px 0; }
  .ob-skip { height: 38px; padding: 0 14px; border: 1.5px solid var(--a-blue); border-radius: 10px; background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .ob-view { margin: 24px 24px 0; aspect-ratio: 1.3; overflow: hidden; border-radius: 20px; border: 1px solid #cfcfcf; background: #fff; }
  .ob-track { display: flex; height: 100%; width: 300%; transition: transform .45s cubic-bezier(.4,0,.2,1); }
  .ob-track img { width: 33.3333%; height: 100%; object-fit: cover; flex: none; }
  .dots { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
  .dots button { width: 34px; height: 7px; border-radius: 4px; border: 0; padding: 0; background: #c8c8c8; cursor: pointer; transition: background .3s; }
  .dots button[aria-current="true"] { background: var(--a-blue); }
  .ob-txt { text-align: center; padding: 0 36px; margin-top: 32px; }
  .ob-txt b { font-size: 20px; }
  .ob-txt p { margin: 10px auto 0; font-size: 15px; line-height: 1.4; color: var(--a-muted); max-width: 300px; }

  /* kod kataklari */
  .codes { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
  .codes input { width: 46px; height: 54px; border: 1px solid var(--a-field); border-radius: 12px; text-align: center; font-size: 24px; font-weight: 700; background: #fff; outline: none; }
  .codes input:focus { border-color: var(--a-blue); box-shadow: 0 0 0 3px rgba(10,122,255,.15); }
  .tgbox { margin-top: 22px; border: 1px solid #ddd; border-radius: 14px; background: #fff; padding: 14px; }
  .tgbox b { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .tgbox b i { color: #2AABEE; font-size: 24px; }
  .tgbox p { margin: 8px 0 0; font-size: 12.5px; line-height: 1.45; color: #555; }
  .tgstate { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; margin-top: 10px; color: #444; }
  .tgstate .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb259; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* pastki menyu */
  .tabbar { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); width: min(420px, calc(100% - 20px)); display: flex; gap: 8px; align-items: center; }
  .tabs { flex: 1; height: 64px; background: rgba(255,255,255,.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 22px; box-shadow: 0 8px 28px rgba(0,0,0,.12); display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px; }
  .tabs a, .mini { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8e8e93; font-size: 11px; font-weight: 600; border-radius: 16px; }
  .tabs a i { font-size: 24px; }
  .tabs a[aria-current="page"] { color: var(--a-blue); }
  .mini { width: 64px; height: 64px; background: rgba(255,255,255,.96); box-shadow: 0 8px 28px rgba(0,0,0,.12); border-radius: 22px; flex: none; }
  .mini i { font-size: 26px; }

  /* asosiy */
  .hero { position: relative; aspect-ratio: 16/10; border-radius: 18px; overflow: hidden; background: #0a1b4a; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s; }
  .hero img.on { opacity: 1; }
  .hdots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .hdots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--a-blue); }
  .hdots i.on { background: var(--a-blue); }
  .big { display: block; border-radius: 18px; overflow: hidden; background: #fff; margin-bottom: 14px; color: var(--a-ink); }
  .big img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; }
  .big div { padding: 12px 14px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .big b { font-size: 17px; }
  .guest { margin: 14px 0; padding: 16px; border-radius: 18px; background: linear-gradient(135deg, #0a84ff, #0546b8); color: #fff; }
  .guest b { font-size: 18px; } .guest p { margin: 6px 0 12px; font-size: 14px; opacity: .9; }
  .guest .row { display: flex; gap: 10px; } .guest .btn { height: 42px; font-size: 15px; } .guest .btn.ln { color: #fff; box-shadow: inset 0 0 0 1.5px #fff; }

  /* kurslar ro'yxati */
  .cl { display: flex; gap: 12px; padding: 10px; background: #fff; border-radius: 16px; margin-bottom: 10px; color: var(--a-ink); align-items: center; }
  .cl .th { position: relative; width: 110px; aspect-ratio: 3/2; border-radius: 10px; overflow: hidden; flex: none; background: #0a1b4a; }
  .cl .th img { width: 100%; height: 100%; object-fit: cover; }
  .cl .th .lk { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.25); color: #fff; font-size: 24px; }
  .cl .th .tag { position: absolute; top: 4px; left: 4px; background: #22c55e; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
  .cl .tx { flex: 1; min-width: 0; }
  .cl b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cl small { display: block; font-size: 12px; color: var(--a-muted); margin-top: 2px; }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--a-muted); }
  .bar i { flex: 1; height: 4px; border-radius: 4px; background: #eee; overflow: hidden; font-style: normal; }
  .bar i b { display: block; height: 100%; background: var(--a-blue); }
  .lockbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #0b1e4f; color: #fff; margin-bottom: 14px; font-size: 14px; font-weight: 600; }
  .lockbar i { color: #ffb347; font-size: 22px; }
  .lockbar span { flex: 1; }
  .lockbar a { background: var(--a-orange); color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 13px; }

  /* kurs va dars */
  .cimg { border-radius: 18px; overflow: hidden; aspect-ratio: 16/10; background: #0a1b4a; }
  .cimg img { width: 100%; height: 100%; object-fit: cover; }
  .prog { margin-top: 14px; padding: 12px 14px; background: #fff; border-radius: 14px; font-size: 14px; color: var(--a-ink2); }
  .prog div { display: flex; justify-content: space-between; } .prog div b { color: var(--a-blue); }
  .ls { display: flex; align-items: center; gap: 14px; padding: 14px; background: #fff; border-radius: 14px; margin-top: 10px; color: var(--a-ink); }
  .ls .n { width: 24px; text-align: center; font-weight: 700; color: var(--a-ink2); flex: none; }
  .ls .t { flex: 1; min-width: 0; } .ls .t b { display: block; font-size: 15px; } .ls .t small { color: var(--a-muted); font-size: 12px; }
  .ls > i { font-size: 24px; flex: none; }

  let ME = store.get('vx_app_me'), PUB = VX.cachedPublic();

  // ---- kesh: avval saqlangan ma'lumot, orqada yangilanadi ----
  const KP = () => 'vx_a_' + String(VX.token() || 'g').slice(-10) + '_';

  function drop() { const a = [...arguments]; try { Object.keys(localStorage).forEach(k => { if (k.startsWith(KP()) && a.some(x => k.startsWith(KP() + x))) { localStorage.removeItem(k); delete FRESH[k]; } }); } catch (_) {} }
  function clearAll() { try { Object.keys(localStorage).forEach(k => { if (k.startsWith('vx_a_')) localStorage.removeItem(k); }); localStorage.removeItem('vx_app_me'); } catch (_) {} }

  async function loadMe(force) {

  // ---- marshrutlar ----
  const TABS = [['asosiy', 'Asosiy', 'house'], ['kurslar', 'Kurslar', 'play-circle'], ['liderlar', 'Liderlar', 'ranking'], ['dokon', "Do'kon", 'storefront'], ['profil', 'Profil', 'user']];

  document.getElementById('miniBtn').onclick = e => { e.preventDefault(); const u = set().mini_app; if (/^https:\/\//.test(u || '')) window.open(u, '_blank', 'noopener'); else toast("Mini app tez orada ochiladi"); };
  const head = (t, sub, extra) => `<div class="top">${'<button class="back" type="button" data-back aria-label="Orqaga">' + ic('caret-left') + '</button>'}<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div><h1>${t}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${extra || ''}</div></div>`;
  const tabHead = (title, sub) => `<div class="tophead"><div><small>${sub}</small><b>${title}</b></div>${member() ? `<a class="bell" href="#bildirishnoma" aria-label="Bildirishnomalar">${ic('bell', 1)}${unread() ? `<i class="n">${unread() > 9 ? '9+' : unread()}</i>` : ''}</a>` : ''}</div>`;

  // ================= TANISHUV =================
  const SLIDES = [['ob1', 'Vector kurslar', "Qadamma-qadam kurslarni o'rganing va faolligingiz uchun sovg'alarni yutib oling"], ['ob2', 'Vector Coin', 'Har bir muvaffaqiyatli yechilgan test uchun Vector Coin oling'], ['ob3', "Do'kon", "Vector Coinlarni do'kon bo'limidagi har xil sovg'alarga almashtiring"]];
  R.tanishuv = () => {

    paint();
  };

  // ================= KIRISH =================
  const phoneInput = el => el.addEventListener('input', () => { let d = el.value.replace(/\D/g, ''); if (d.startsWith('998') && d.length > 9) d = d.slice(3); d = d.slice(0, 9); el.value = d.length > 0 ? phoneFmt(d.padEnd(9, ' ')).replace(/[\s-]+$/, '').replace(/\)-?$/, d.length > 2 ? ')-' : '') : ''; if (d.length <= 2) el.value = d.length ? '(' + d : ''; });
  const eye = () => app.querySelectorAll('.pw button').forEach(b => b.onclick = () => { const i = b.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; b.innerHTML = ic(i.type === 'password' ? 'eye' : 'eye-slash', 1); });
  const terms = `<p class="note">Davom etish uchun <a href="#qoida" style="font-weight:600">Foydalanuvchi shartlariga</a> rozi bo'lishingiz kerak</p>`;
  R.kirish = () => {
    show(`<div class="scr auth"><div class="hero-in"><div><h1>Xush<br>kelibsiz</h1><p>Akkauntingizga kiring va o'qishni davom ettiring</p></div><img src="assets/img/cat-happy.png" alt=""></div>
      <div class="panel"><form class="stack" id="f" novalidate>
        <label class="fl"><span>Telefon raqam</span><div class="phone"><span class="cc">+998</span><input class="in" name="phone" inputmode="numeric" autocomplete="tel" placeholder="(00)-000-00-00"></div></label>
        <label class="fl"><span>Parol</span><div class="pw"><input class="in" name="password" type="password" autocomplete="current-password" placeholder="Parolingiz"><button type="button" aria-label="Parolni ko'rsatish">${ic('eye', 1)}</button></div></label>
        <a class="forgot" href="#parol">Parolni unutdingizmi?</a>
        <div class="err" role="alert" hidden></div>
        <button class="btn" type="submit">Kirish</button>
        <p class="note">Akkauntingiz yo'qmi? <a href="#royxat" style="font-weight:700">Ro'yxatdan o'tish</a></p>${terms}

    const f = $('#f'), er = f.querySelector('.err'); phoneInput(f.phone); eye();
    f.onsubmit = e => {

      if (phone.length !== 9) { er.textContent = "Telefon raqamni to'liq kiriting"; er.hidden = false; return; }
      busy(app.querySelector('#f [type=submit]'), async () => { const r = await VX.call('login', { phone, password: f.password.value }); VX.setToken(r.token); setMe(r.user); applyDark(); location.replace('#asosiy'); })
        .catch(x => { er.textContent = x.message; er.hidden = false; });
    };
  };

  // ================= RO'YXATDAN O'TISH (Telegram orqali) =================
  let REG = null;
  R.royxat = () => {
    const ref = (new URLSearchParams(location.search).get('ref') || store.get('vx_ref') || '').toUpperCase();
    if (ref) store.set('vx_ref', ref);
    const noBot = PUB && PUB.settings && !PUB.settings.tg_bot;
    show(`<div class="scr auth">${head('<span style="font-size:24px">Ro\'yxatdan o\'tish</span>')}
      <form class="body nobar stack" id="f" novalidate style="padding:20px 24px 0">
        ${noBot ? `<label class="fl"><span>Telefon raqamni kiriting</span><div class="phone"><span class="cc">+998</span><input class="in" name="phone" inputmode="numeric" placeholder="(00)-000-00-00"></div></label>` : ''}
        <label class="fl"><span>Ism familiya</span><input class="in" name="name" autocomplete="name"></label>
        <div class="g2"><label class="fl"><span>Parol</span><div class="pw"><input class="in" name="p1" type="password" autocomplete="new-password"><button type="button" aria-label="Parolni ko'rsatish">${ic('eye', 1)}</button></div></label>
          <label class="fl"><span>Parolni qayta kiriting</span><input class="in" name="p2" type="password" autocomplete="new-password"></label></div>
        <label class="fl"><span>Taklif kodi (ixtiyoriy)</span><input class="in" name="ref" value="${esc(ref)}" placeholder="Masalan: X7K2P9Q" style="text-transform:uppercase"></label>
        ${noBot ? '' : `<div class="tgbox"><b>${ic('telegram-logo', 1)}Telefon Telegram orqali tasdiqlanadi</b><p>Keyingi qadamda botimizga o'tasiz va raqamingizni yuborasiz. Parolni unutsangiz ham shu bot yordam beradi.</p></div>`}
        <div class="err" role="alert" hidden></div>
      </form>
      <div class="foot"><button class="btn" type="submit" form="f">Davom etish</button>${terms}</div></div>`);
    const f = $('#f'), er = f.querySelector('.err'); eye(); if (f.phone) phoneInput(f.phone);
    f.onsubmit = e => {
      e.preventDefault(); er.hidden = true;
      const fail = m => { er.textContent = m; er.hidden = false; };
      const name = f.name.value.trim(), p1 = f.p1.value, code = f.ref.value.trim().toUpperCase();
      if (name.length < 3) return fail('Ism va familiyangizni kiriting');
      if (p1.length < 6) return fail("Parol kamida 6 belgidan iborat bo'lsin");
      if (p1 !== f.p2.value) return fail('Parollar bir xil emas');
      busy(app.querySelector('[form=f]'), async () => {
        if (f.phone) {
          const phone = f.phone.value.replace(/\D/g, ''); if (phone.length !== 9) return fail("Telefon raqamni to'liq kiriting");
          const r = await VX.call('register', { phone, name, password: p1, ref: code }); VX.setToken(r.token); setMe(r.user); location.replace('#asosiy'); return;
        }
        const r = await VX.call('reg.start', { name, password: p1, ref: code });
        REG = { rid: r.rid, link: r.link }; go('kod');
      }).catch(x => fail(x.message));
    };
  };
  let POLL = 0;
  R.kod = () => {
    if (!REG) { location.replace('#royxat'); return; }
    show(`<div class="scr auth"><div class="top plain"><button class="back" type="button" data-back aria-label="Orqaga">${ic('caret-left')}</button></div>
      <form class="body nobar" id="f" novalidate style="padding:0 24px;text-align:center">
        <h1 style="font-size:20px;font-weight:700;margin:4px 0 0;line-height:1.3">Ro'yxatdan o'tish uchun Telegram botdan kelgan 6 xonali kodni ilovaga kiriting</h1>
        <p class="note" style="margin-top:8px">Kodni shu kataklarga kiriting</p>
        <div class="codes">${Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" aria-label="${i + 1}-raqam" autocomplete="${i ? 'off' : 'one-time-code'}">`).join('')}</div>

    const cells = [...app.querySelectorAll('.codes input')], f = $('#f'), er = f.querySelector('.err'), ok = $('#ok');

    cells.forEach((c, i) => {
      c.addEventListener('input', () => { const d = c.value.replace(/\D/g, ''); if (d.length > 1) { d.split('').slice(0, 6 - i).forEach((x, k) => { cells[i + k].value = x; }); cells[Math.min(5, i + d.length)].focus(); } else { c.value = d; if (d && i < 5) cells[i + 1].focus(); } ok.disabled = val().length !== 6; if (val().length === 6) f.requestSubmit(); });
      c.addEventListener('keydown', e => { if (e.key === 'Backspace' && !c.value && i) cells[i - 1].focus(); });

    const st = $('#st');
    const setSt = (t, done) => { st.innerHTML = done ? `<span>✅</span><span>${esc(t)}</span>` : `<span class="dot"></span><span>${esc(t)}</span>`; };
    $('#tgGo').addEventListener('click', () => setSt('Telefon raqam kutilmoqda…'));

        .catch(x => { er.textContent = x.message; er.hidden = false; cells.forEach(c => { c.value = ''; }); cells[0].focus(); ok.disabled = true; });

  // ================= PAROLNI TIKLASH =================

    };

        <button class="btn" type="submit">O'tkazdim</button>` : `<p class="note">Donat qabul qilish hali sozlanmagan. Adminga yozing: <a href="https://t.me/${esc(tgName())}" target="_blank" rel="noopener">@${esc(tgName())}</a></p>`}
    </div></form></div>`);
    const f = $('#f');
    app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { f.amount.value = sum(b.dataset.v); });
    f.amount.addEventListener('input', () => { const d = f.amount.value.replace(/\D/g, '').slice(0, 9); f.amount.value = d ? sum(d) : ''; });
    if (!card) return;
    $('#cp').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(card) : Promise.reject()).then(() => toast('Nusxalandi', 'success')).catch(() => {}); };
    $('#uf').onchange = async e => { const fl = e.target.files[0]; if (!fl) return; try { img = await VX.resizeImage(fl, 1400, .82); $('#ui').innerHTML = `<img src="${img}" alt="">`; $('#ut').textContent = 'Chek yuklandi ✓'; } catch (x) { toast(x.message, 'error'); } };
    f.onsubmit = e => { e.preventDefault(); const amount = Number(f.amount.value.replace(/\D/g, ''));
      if (amount < 1000) return toast("Miqdorni kiriting (kamida 1 000 so'm)", 'error'); if (!img) return toast("To'lov chekini yuklang", 'error');
      busy(f.querySelector('[type=submit]'), async () => { await VX.call('donate', { name: f.name.value, amount, image: img });
        modal(`<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px"><img src="assets/img/cat-happy.png" alt="" style="width:130px"><h2>Rahmat! 💙</h2><p class="muted" style="margin:0">Qo'llab-quvvatlovingiz admin tasdiqlagach qabul qilinadi.</p><button class="btn" data-close style="margin-top:8px">Yaxshi</button></div>`); go('profil'); }).catch(x => toast(x.message, 'error')); };
  };

  // ================= JAMOA (SARDOR) =================
  R.jamoa = async () => {
    const t = await VX.call('team', { school: ME.school });
    const S = { yangi: ['', "Ko'rib chiqilmoqda", 'Arizangiz yuborildi. Javob Telegram botga keladi.'], qabul: ['gn', 'Qabul qilindi 🎉', "Tabriklaymiz! Siz Vector sardorisiz. Admin siz bilan bog'lanadi."], rad: ['rd', 'Qabul qilinmadi', 'Keyinroq qayta ariza yuborishingiz mumkin.'] };
    let img = '';
    show(`<div class="scr">${head("Vector sardori bo'ling", "Maktabingizda Vector vakili bo'ling. Har bir maktabdan " + t.limit + ' tagacha sardor qabul qilamiz.')}<div class="body nobar">
      <div class="feat">${[['t-shirt', 'Vector yuniformasi', 'Sardorlar uchun maxsus kiyim'], ['certificate', 'Guvohnoma va sertifikat', 'Rasmiy Vector sardori maqomi'], ['crown', '1 yillik bepul dostup', 'Platformaning barcha kurslari'], ['money', 'Har bir mijozdan ulush', 'Siz jalb qilgan har bir mijoz uchun']].map(([i, b, s]) => `<div><i class="ph-fill ph-${i}"></i><b>${b}</b><small>${s}</small></div>`).join('')}</div>
      <div class="ok" style="margin-top:12px;background:var(--a-blue-l);color:#1d4ed8">${ic('clock', 1)} Talab: har kuni platformaga 2 soat vaqt ajratish, Vector'ni targ'ib qilish va yangi mijozlar jalb qilish.</div>
      ${t.mine && t.mine.status !== 'rad' ? `<div class="card pad" style="margin-top:14px;text-align:center"><span class="pill ${S[t.mine.status][0]}" style="font-size:15px">${S[t.mine.status][1]}</span><p class="muted" style="margin:10px 0 0">${S[t.mine.status][2]}</p>${t.mine.note ? `<p style="margin:8px 0 0">${esc(t.mine.note)}</p>` : ''}</div>` : `
      <form class="card pad stack" id="f" novalidate style="margin-top:14px">
        <label class="avpick"><span class="c" id="pc">${ic('camera-plus')}</span><span><b style="font-size:14px">Rasmingiz</b><br><small class="muted">JPG yoki PNG</small></span><input type="file" accept="image/*" id="pf" class="sr"></label>
        <label class="fl"><span>Ism-familiya</span><input class="in" name="name" value="${esc(ME.name)}"></label>
        <label class="fl"><span>Telefon raqami</span><input class="in" name="phone" inputmode="numeric" value="${esc(ME.phone)}"></label>
        <label class="fl"><span>Viloyat / tuman</span><input class="in" name="region" value="${esc(ME.region || '')}" placeholder="Masalan, Farg'ona, Marg'ilon"></label>
        <div class="g2"><label class="fl"><span>Maktab raqami</span><input class="in" name="school" value="${esc(ME.school || '')}" placeholder="4-maktab"></label><label class="fl"><span>Sinf</span><input class="in" name="grade" value="${esc(ME.grade || '')}" placeholder="9-B"></label></div>
        <label class="fl"><span>Telegram username</span><input class="in" name="telegram" placeholder="@username"></label>
        <div class="slots" id="sl"></div>
        <label class="fl"><span>Nega sardor bo'lmoqchisiz?</span><textarea class="in" name="why"></textarea></label>
        <label class="fl"><span>Tajriba yoki yutuqlaringiz</span><textarea class="in" name="experience" placeholder="Olimpiadalar, to'garaklar, loyihalar..."></textarea></label>
        <button class="btn" type="submit">Ariza yuborish</button></form>`}
    </div></div>`);
    const f = $('#f'); if (!f) return;
    const slots = (sch, free) => { $('#sl').innerHTML = sch ? `<div><span>${esc(sch)}${/maktab/i.test(sch) ? '' : '-maktab'}da bo'sh joylar</span><b style="color:var(--a-green)">${free} / ${t.limit}</b></div><i><b style="width:${free / t.limit * 100}%"></b></i>` : ''; };
    slots(t.school, t.free);
    let st = 0; f.school.addEventListener('input', () => { clearTimeout(st); st = setTimeout(() => VX.call('team', { school: f.school.value }).then(x => slots(f.school.value, x.free)).catch(() => {}), 600); });
    $('#pf').onchange = async e => { const fl = e.target.files[0]; if (!fl) return; try { img = await VX.resizeImage(fl, 600, .85); $('#pc').innerHTML = `<img src="${img}" alt="">`; } catch (x) { toast(x.message, 'error'); } };
    f.onsubmit = e => { e.preventDefault(); const d = { name: f.name.value, phone: f.phone.value.replace(/\D/g, '').slice(-9), region: f.region.value, school: f.school.value, grade: f.grade.value, telegram: f.telegram.value, why: f.why.value, experience: f.experience.value, photo: img || undefined };
      busy(f.querySelector('[type=submit]'), async () => { await VX.call('team.apply', d); toast('Arizangiz yuborildi', 'success'); route(); }).catch(x => toast(x.message, 'error')); };
  };

  // ================= DO'STLARNI TAKLIF QILISH =================
  R.taklif = async () => {
    const r = await swr('ref');
    const site = location.origin + location.pathname.replace(/[^/]*$/, '');
    const link = site + 'app.html?ref=' + r.code + '#royxat';
    const text = `Vector'da IT kasblarni o'rganaman, test yechib coin yig'aman va sovg'alar olaman! Mening kodim bilan birinchi oyga ${r.discount}% chegirma oling: ${r.code}`;
    show(`<div class="scr">${head("Do'stlarni taklif qilish")}<div class="body nobar">
      <div class="banner"><div class="h"><b>Do'stlarni taklif qilish</b><span class="coinb">${coin(r.earned)} coin</span></div><p>Promokodingizni do'stingizga yuboring. Do'stingiz birinchi oy uchun ${r.discount}% chegirma oladi, u Premium xarid qilsa, sizga ${r.perFriend} coin sovg'a qilinadi.</p>
        <div class="codecard"><small>Sizning promokodingiz</small><div class="c">${esc(r.code)}</div><small>♾ Kod doimiy — istalgancha ulashing</small><div class="row"><button class="btn ln" type="button" id="cp">${ic('copy', 1)} Nusxalash</button><button class="btn or" type="button" id="sh">${ic('share-network', 1)} Ulashish</button></div></div></div>
      <div class="card pad" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:17px">Bonuslar</b><span class="muted" style="font-size:13px">${r.paid} ta do'st Premium oldi</span></div>
        <div class="bon">${r.bonuses.map(b => `<div class="${b.done ? 'on' : ''}"><i class="ph-fill ph-${b.done ? 'trophy' : 'lock-simple'}"></i><b>${b.coins} coin</b><small>${b.need} ta do'stga</small></div>`).join('')}</div></div>
      <div class="card pad" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">Taklif qilgan do'stlaringiz</b><span class="pill bl">${r.friends.length} ta</span></div>
        ${r.friends.length ? r.friends.map(x => `<div class="lrow" style="padding:12px 0">${avatar(x, 'av')}<span class="nm"><b>${esc(x.name)}</b><small>${dt(x.at)}</small></span><span class="pill ${x.paid ? 'gn' : 'gy'}">${x.paid ? 'Premium ✓' : "Ro'yxatdan o'tdi"}</span></div>`).join('') : '<p class="note" style="margin-top:12px">Hali hech kimni taklif qilmadingiz. Promokodingizni do\'stlaringizga yuboring.</p>'}</div>
      ${r.canApply ? `<form class="card pad" id="ap" style="margin-top:14px"><b>Do'stingizning taklif kodi bormi?</b><p class="muted" style="margin:4px 0 10px;font-size:13px">Birinchi oy obunasiga ${r.discount}% chegirma oling</p><div style="display:flex;gap:8px"><input class="in" name="code" placeholder="MASALAN, X7K2P9Q" style="text-transform:uppercase"><button class="btn sm" type="submit">Qo'llash</button></div></form>` : r.refBy ? `<p class="ok" style="margin-top:14px">✓ Siz do'stingiz kodi bilan ro'yxatdan o'tgansiz${r.discount ? ` — birinchi oylik obunaga ${r.discount}% chegirma` : ''}.</p>` : ''}
    </div></div>`);
    $('#cp').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(r.code) : Promise.reject()).then(() => toast('Nusxalandi', 'success')).catch(() => toast(r.code)); };
    $('#sh').onclick = () => {
      if (navigator.share) { navigator.share({ title: 'Vector', text, url: link }).catch(() => {}); return; }
      const m = modal(`<div class="mh"><h2>Ulashish</h2><button class="mx" data-close aria-label="Yopish">${ic('x')}</button></div>
        <a class="lnk" href="https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}" target="_blank" rel="noopener"><i class="b" style="background:#2AABEE">${ic('telegram-logo', 1)}</i>Telegram<span class="go">${ic('arrow-up-right')}</span></a>
        <a class="lnk" href="sms:?body=${encodeURIComponent(text + ' ' + link)}"><i class="b" style="background:#22a55b">${ic('chat-circle-text', 1)}</i>SMS<span class="go">${ic('arrow-up-right')}</span></a>
        <button class="lnk" type="button" id="cl" style="width:100%;cursor:pointer"><i class="b" style="background:#7a5af8">${ic('link', 1)}</i>Havolani nusxalash<span class="go">${ic('copy')}</span></button>`);
      m.el.querySelector('#cl').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(text + ' ' + link) : Promise.reject()).then(() => { toast('Nusxalandi', 'success'); m.close(); }).catch(() => {}); };
    };
    const ap = $('#ap'); if (ap) ap.onsubmit = e => { e.preventDefault(); busy(ap.querySelector('button'), async () => { const x = await VX.call('ref.apply', { code: ap.code.value }); drop('ref', 'me'); setMe(x.user); toast(`Kod qo'llandi: birinchi oyga ${x.discount}% chegirma`, 'success'); route(); }).catch(x => toast(x.message, 'error')); };
  };

  // ================= ILOVA HAQIDA, TAKLIF, YORDAM, QOIDALAR =================
  R.haqida = () => {
    const s = set(), ig = String(s.instagram || '').replace(/^@/, '');
    const links = [['Instagram', ig && 'https://instagram.com/' + ig, 'instagram-logo', 'linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)'], ['Telegram', 'https://t.me/' + tgName(), 'telegram-logo', '#2AABEE'], ['YouTube', s.youtube, 'youtube-logo', '#FF0000'],
      ['Web sayt', s.site_url || location.origin + location.pathname.replace(/[^/]*$/, ''), 'globe', '#0a7aff'], ['Mobil ilova', s.app_url || s.google_play, 'android-logo', '#22a55b']].filter(x => /^https:\/\//.test(x[1] || ''));
    show(`<div class="scr">${head('Ilova haqida')}<div class="body nobar"><div class="card pad" style="text-align:center">
      <div style="aspect-ratio:1.6;border-radius:18px;background:linear-gradient(160deg,#1E73F6,#0047B8);display:grid;place-items:center"><img src="assets/img/vector-logo.png" alt="Vector" style="width:42%;border-radius:24px"></div>
      <p style="margin:14px 0 0;font-size:15px;line-height:1.45">O'zbekistonda birinchi raqamli zamonaviy kasblarni o'rganish platformasi</p></div>
      <p class="grp">Ijtimoiy tarmoqlarimiz</p>${links.map(([t, u, i, bg]) => `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener"><i class="b" style="background:${bg}">${ic(i, 1)}</i>${t}<span class="go">${ic('arrow-up-right')}</span></a>`).join('')}
      <p class="note" style="margin-top:18px">Versiya 1.0.0</p></div></div>`);
  };
  R['taklif-yuborish'] = () => {
    const tg = 'https://t.me/' + tgName();
    show(`<div class="scr">${head('Bizga taklifingiz')}<div class="body nobar"><div class="card pad"><p style="margin:0 0 4px;font-size:16px">Qaysi bo'limga taklif yuborasiz</p>
      ${[['Rahbarga murojaat', 'av-boss'], ['Dasturchiga murojaat', 'av-dev'], ['Marketingga murojaat', 'av-mkt']].map(([t, a]) => `<a class="lnk" href="${tg}" target="_blank" rel="noopener"><img src="assets/img/app/${a}.png" alt="">${t}<span class="go">${ic('arrow-up-right')}</span></a>`).join('')}
      <p class="note" style="margin-top:12px">Xabaringiz Telegram orqali @${esc(tgName())} ga yetib boradi.</p></div></div></div>`);
  };
  R.yordam = () => {
    const s = set(), rate = s.coin_per_correct || 2, bc = s.birthday_coins || 50;
    const F = [['hisob', 'user', 'Parolimni unutdim, nima qilaman?', "Kirish oynasida «Parolingizni unutdingizmi?» ni bosing. Telegram botimiz kod yuboradi, kod va yangi parolni kiritasiz."],
      ['hisob', 'device-mobile', "Telefon raqamimni qanday o'zgartiraman?", `Telefon raqam akkauntning kaliti. O'zgartirish uchun @${tgName()} ga yozing.`],
      ['obuna', 'diamond', 'Obunani qanday sotib olaman?', "Profil → Premium olish bo'limida tarifni tanlang va to'lovni amalga oshiring. Tasdiqlangach barcha kurslar ochiladi."],
      ['obuna', 'calendar-x', "Obunam tugasa nima bo'ladi?", "Darslar yopiladi, lekin progress, coinlar va buyurtmalar saqlanib qoladi. Uzaytirsangiz, hammasi davom etadi."],
      ['kurslar', 'play-circle', 'Video ochilmayapti, nima qilay?', "Internetni tekshiring va ilovani qayta oching. Obuna faolligini «Mening obunam» bo'limida ko'ring."],
      ['kurslar', 'exam', "Testga nega o'ta olmayapman?", "Avval videoni oxirigacha ko'ring. Testni qayta ishlash mumkin, coin esa faqat birinchi urinishda beriladi."],
      ['coin', 'coins', 'Vector Coin qanday to\'planadi?', `Testdagi har bir to'g'ri javob — ${rate} coin, tug'ilgan kuningizda — ${bc} coin, do'stlaringiz Premium olsa — bonus coin.`],
      ['coin', 'truck', "Sovg'am qachon yetkaziladi?", "Xariddan so'ng admin siz bilan bog'lanadi. Holatini «Buyurtmalar» bo'limida ko'rasiz."],
      ['sertifikat', 'seal-check', 'Sertifikatni qanday olaman?', "Kursning barcha darslarini tugatsangiz, u «Sertifikatlar» bo'limida paydo bo'ladi."]];
    let cat = 'all', q = '';
    show(`<div class="scr">${head('Yordam')}<div class="body nobar">
      <label class="srch" style="margin-top:0">${ic('magnifying-glass')}<input id="hq" type="search" placeholder="Savolingizni yozing" aria-label="Savolingizni yozing"></label>
      <div class="chips" style="margin-top:12px">${[['all', 'Hammasi'], ['hisob', 'Hisob'], ['obuna', 'Obuna'], ['kurslar', 'Kurslar'], ['coin', "Coin va do'kon"], ['sertifikat', 'Sertifikat']].map(([k, t]) => `<button type="button" data-c="${k}" aria-pressed="${k === 'all'}">${t}</button>`).join('')}</div>
      <div class="card faq" id="fq" style="margin-top:12px;overflow:hidden"></div>
      <p class="grp">Javob topmadingizmi?</p>
      <a class="lnk" href="https://t.me/${esc(tgName())}" target="_blank" rel="noopener"><i class="b" style="background:#2AABEE">${ic('telegram-logo', 1)}</i><span>Telegram yordam<br><small class="muted" style="font-weight:500">@${esc(tgName())}</small></span><span class="go">${ic('arrow-up-right')}</span></a>
      ${s.phone ? `<a class="lnk" href="tel:${esc(String(s.phone).replace(/[^+\d]/g, ''))}"><i class="b" style="background:#22a55b">${ic('phone', 1)}</i><span>Qo'ng'iroq qilish<br><small class="muted" style="font-weight:500">${esc(s.phone)}</small></span><span class="go">${ic('arrow-up-right')}</span></a>` : ''}
      <a class="lnk" href="#taklif-yuborish"><i class="b" style="background:#ff8a00">${ic('lightbulb', 1)}</i>Taklif yoki shikoyat<span class="go">${ic('caret-right')}</span></a></div></div>`);
    const draw = () => { $('#fq').innerHTML = F.filter(x => (cat === 'all' || x[0] === cat) && (!q || (x[2] + x[3]).toLowerCase().includes(q))).map(x => `<details><summary><i class="ic ph-fill ph-${x[1]}"></i>${esc(x[2])}<span class="ch">${ic('caret-down')}</span></summary><p>${esc(x[3])}</p></details>`).join('') || '<p class="note" style="padding:16px">Bunday savol topilmadi.</p>'; };
    $('#hq').oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
    app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; app.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
    draw();
  };
  R.qoida = () => {
    const tg = tgName();
    const L = [['credit-card', 'Obuna va kirish', "Platformadagi darslar pullik bo'lib, 1 oylik yoki 12 oylik obuna shaklida sotiladi. Muddat tugagach darslar vaqtincha yopiladi, to'lov qilinsa barcha progress tiklanadi. Obunalar avtomatik ravishda yechilmaydi."],
      ['arrows-counter-clockwise', 'Pulni qaytarish (Refund)', `Xarid qilingan kundan boshlab 7 kun ichida asosli sabab ko'rsatilsa, pul 100% to'liq qaytariladi (murojaat uchun: @${tg}).`],
      ['shield-check', 'Hisob xavfsizligi', "Har bir akkaunt shaxsiy bo'lishi shart va uni boshqalarga berish taqiqlanadi. Parol va xavfsizlik uchun foydalanuvchi o'zi to'liq mas'ul."],
      ['prohibit', 'Foydalanish qoidalari', "Spam tarqatish, noqonuniy kontent yuklash, birovning intellektual mulk huquqini buzish yoki dasturga qasddan zarar yetkazish qat'iyan taqiqlanadi. 12 oydan ortiq ishlatilmagan akkauntlar o'chirilishi mumkin."],
      ['copyright', 'Intellektual mulk', "Barcha materiallar va dasturiy ta'minot Vector'ga tegishli. Ularni ruxsatsiz ko'chirish, sotish yoki teskari muhandislik qilish mumkin emas."],
      ['scales', "Mas'uliyatni cheklash", "Xizmat \"bor holicha\" taqdim etiladi. Vector'ning maksimal umumiy javobgarligi foydalanuvchi to'lagan obuna summasidan oshmaydi."]];
    show(`<div class="scr">${head('')}<div class="body nobar"><div class="banner" style="display:flex;gap:12px;align-items:center"><span style="width:48px;height:48px;border-radius:14px;background:var(--a-orange);display:grid;place-items:center;font-size:24px;flex:none">${ic('gavel', 1)}</span><div><b>Foydalanish shartlari</b><p style="margin:2px 0 0">Platformadan foydalanishdan oldin tanishib chiqing</p></div></div>
      <div class="card pad" style="margin-top:14px">${L.map(([i, t, d]) => `<div class="rule"><i class="ph-fill ph-${i}"></i><div><b>${t}</b><p>${esc(d)}</p></div></div>`).join('')}</div>
      <a class="lnk" href="https://t.me/${esc(tg)}" target="_blank" rel="noopener" style="background:#fff6ea;border-color:#ffd9a8"><i class="b" style="background:var(--a-orange)">${ic('headset', 1)}</i>Savollaringiz bo'lsa, adminga yozing<span class="go">@${esc(tg)}</span></a></div></div>`);
  };

  // ================= ISHGA TUSHIRISH =================
  applyDark();
  const sp = document.getElementById('splash');
  const seen = (() => { try { return sessionStorage.getItem('vx_splash'); } catch (_) { return 1; } })();
  const ready = Promise.all([VX.publicData().then(d => { PUB = d; }).catch(() => {}), VX.token() ? loadMe().catch(e => { if (e && (e.code === 'auth' || e.code === 'blocked')) { clearAll(); VX.setToken(null); ME = null; } }) : null]);
  // Animatsiya ~5 soniya; bosilsa darhol o'tadi. Bir seansda faqat bir marta ko'rsatiladi.
  const anim = new Promise(r => { if (seen || matchMedia('(prefers-reduced-motion: reduce)').matches) { r(); return; } const t = setTimeout(r, 4750); sp.addEventListener('click', () => { clearTimeout(t); r(); }); });
  if (seen) sp.style.display = 'none';
  Promise.all([Promise.race([ready, new Promise(r => setTimeout(r, 6000))]), anim]).then(() => {
    try { sessionStorage.setItem('vx_splash', '1'); } catch (_) {}
    route(); sp.style.opacity = '0'; setTimeout(() => sp.remove(), 520);
    if (member()) setTimeout(() => { askProfile(); ['courses', 'shop', 'plans'].forEach(a => swr(a, null, () => {}).catch(() => {})); }, 1200);
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
<script src="assets/js/vector-i18n.js"></script>
<script src="assets/js/vector-i18n-dict.js"></script>
